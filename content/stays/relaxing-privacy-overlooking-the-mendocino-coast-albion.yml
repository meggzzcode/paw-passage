description: A three-bedroom family house in Albion with a queen bed in each room, two bathrooms and room for 6. The listing shows a hot tub on the side porch, a deck or patio, a porch, an outdoor play area, a separate dining area, a full kitchen, a barbecue grill and a washer. The beach near Albion is a 19-minute walk and the Albion River Bridge two minutes by car. The Vrbo FAQ allows 2 dogs in total; no weight limit or pet fee is stated and the play area is not described as fenced. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
