title: The Sunrise Breakfast Club
clue: "The world is quiet, the sky is changing colour and the morning paper is rolled up under the blanket."
reveal: "Start the day with a dog-led nose-round of the first-light smells near your door. Back at the club spot, a rolled worn T-shirt (the Morning Paper) and a favourite toy wait under the blanket, and your dog picks the headline. At noon, their favourite stop gets a second look."
objective: "Take a short dog-led sniff round in the first light, let your dog find the paper and the toy at the club spot, and compare their favourite stop at dawn and at noon."
instructions:
  - "The evening before, pick a club spot a few steps from your door that you can reach easily: a doorstep, balcony, yard edge or window seat. Roll a worn T-shirt loosely into a bundle: this bundle is the Morning Paper. Sunrise itself is optional. If you want to watch it, check tomorrow's sunrise time and set an alarm forty minutes earlier; otherwise any time in your dog's first hour of the morning works."
  - "In the morning, lay a blanket at the club spot and tuck the Morning Paper under a folded corner, beside one of your dog's favourite toys, both partly showing."
  - "Take your dog out on a lead, or into an enclosed space, for the morning round: three short stops within sight of home, such as the doorstep, the nearest tree and the garden edge. Stand still and let your dog choose which stop to read first and how long to stay. The stop where they stay longest is the Dew Post. If another dog appears, step back indoors."
  - "Follow their nose rather than leading it. If they stop to sniff, wait. If they want to go home early, go home early."
  - "Walk to the club spot together. Let your dog find what is under the blanket in their own time and choose: the paper, the toy or neither. Whichever they pick first is today's headline. Take the bundle away if your dog chews it."
  - "Settle in with your warm drink and put the phone away. It comes out once, for the single sunrise or morning-sky photo. Sit quietly while your dog has the morning, and name three things you can see, hear or smell, taking turns in a low voice."
  - "Noon check: around midday, or any time later that day, visit the Dew Post again on a lead for a minute and see if your dog reads it the same way. Close the club with the front-page ritual: say both headlines aloud, such as Toy Beats Paper, Again, and Long Read at Dawn, Quick Glance at Noon, and leave the toy and the bundle on the blanket for your dog to keep until you tidy up."
twist: "Your dog reads the morning news first with their nose, picks the front page from the paper and the toy, and then you find out whether the Dew Post smells the same at noon as it did at first light."
variations:
  - "From bed or the sofa: open a window, hide the paper and toy under the blanket beside you and skip the outdoor round."
  - "For a dog who sleeps in: skip the sunrise and hold the club at the first sunny spot of the morning."
  - "For limited mobility: make it one stop, a few steps from the door, and sit for the rest."
  - "Sunrise chaser, optional: set the alarm and hold the club at the actual sunrise, still on your doorstep or balcony."
completion: "Your dog has read the morning round, chosen the headline and you have taken your one photo. Skipping the noon check or ending early still counts."
photoIdea: "One photo of the sky, and if the light allows, your dog's silhouette with their toy."
memoryPrompt: "Which stop did your dog read first, what was the headline and was the Dew Post the same at noon?"
