description: Two-bedroom cabin for up to 4 guests in Mineral Bluff, steps from the river, with a hot tub, a fire pit, a deck and porch, and a garden. The Vrbo Policies section allows one well-behaved pet under 20 lb, considers larger pets with prior approval, charges a fee for a second pet (no amount shown), and mentions a fenced area. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
