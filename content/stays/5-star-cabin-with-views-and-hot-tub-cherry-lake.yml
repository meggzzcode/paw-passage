description: This two-bedroom cabin in the Cherry Lake area of Blue Ridge has a hot tub, a deck or patio and a barbecue grill, and sleeps 5. The listing allows dogs, up to 2 pets at a maximum of 50 lbs each, and says some restrictions may apply. It does not state a pet fee or any fence. On 2026-11-18 the Vrbo listing page was read through its FAQ, reviews and footer; it states the dog count and weight limit and that some restrictions may apply, but its Policies section was not readable and no pet fee, breed rule, fence or crate rule appeared. A web search found no other page for this exact property. Not confirmed with the host.
