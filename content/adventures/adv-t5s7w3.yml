dietNotes: Only their usual breakfast portion, served as normal. Ask your vet about diet; share nothing from your own plate.
safety:
  - "Share nothing from your plate or mug: caffeine, chocolate and grapes are unsafe for dogs."
  - Check the cold, heat and ground first, dress for the weather and head in if your dog shivers or pants.
  - Beyond your own fenced yard, keep your dog on a leash, and ask your vet before taking a puppy anywhere public.
