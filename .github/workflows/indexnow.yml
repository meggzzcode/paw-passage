# Submits the sitemap's page addresses to IndexNow (Bing and other participating search engines).
# DISABLED ON PURPOSE: it only runs when you click "Run workflow" (GitHub > Actions > IndexNow > Run workflow),
# and only after a production deploy has finished. To make it automatic later, add a `push: branches: [main]` trigger
# AFTER the first manual run has returned status 200 or 202.
# No secrets: the key is public and lives in public/<key>.txt.
name: IndexNow

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Really send (leave off for a dry run that only prints)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry run
        if: ${{ !inputs.send }}
        run: node scripts/indexnow.mjs
      - name: Submit to IndexNow
        if: ${{ inputs.send }}
        run: node scripts/indexnow.mjs --send
