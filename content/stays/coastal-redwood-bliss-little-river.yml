description: A two-bedroom house in Little River on the Mendocino coast that sleeps 4, with a king bed and a queen bed and two bathrooms. The amenity list shows a hot tub on site, a deck or patio, a kitchen, a barbecue grill and a washer, and photo captions point to a wood stove and a backyard fire pit. Van Damme State Park is about a one-minute walk away. The Vrbo FAQ allows 1 dog in total and the page gives no weight limit, pet fee or fence detail. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
