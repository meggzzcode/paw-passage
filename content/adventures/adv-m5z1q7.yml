id: adv-m5z1q7
title: A Trip Down Memory Lane
clue: Then and now, side by side, and one of you has not changed their expression.
reveal: Find an old photo of your dog, bring back something from it and recreate the setting today. Put the two side by side and see what has changed and what has not.
objective: Recreate an old photo of your dog and make a then-and-now pair.
instructions:
  - Scroll your photos for an early picture of your dog with a clear place or object in it, such as a blanket, a toy or a corner of a room.
  - Work out where it was taken. Recreate it at home with a similar blanket or corner by default. Go back to the place only if it is still quiet and your dog is comfortable there now.
  - Gather one item from the photo, such as the old toy or blanket, and let your dog sniff it before you start. Let them take it in at their own pace.
  - Set up the same angle and take a new photo without posing them. Wait for a natural moment; many frames are fine.
  - "Place the two photos side by side and write one line for each: what you remember then and what you notice now."
twist: "Your dog gets to revisit too: bring back the old toy, blanket or spot and see what they make of it."
variations:
  - "At home: recreate the old photo with a blanket and a corner of the room."
  - "For a puppy: make a first-month photo now to compare in a year."
  - "For a dog who has no early photos: choose the oldest one you have."
completion: You have a new photo that matches the old one and a line written for each.
photoIdea: The new photo, from the same angle as the old one, with your dog relaxed rather than still.
memoryPrompt: What has changed since the first photo, and what has not?
