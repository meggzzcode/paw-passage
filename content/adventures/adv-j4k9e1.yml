safety:
  - Use only foods your dog already eats, and ask your vet before changing their diet.
  - Never use chocolate, xylitol, grapes, raisins, onion, garlic or macadamia nuts.
  - Check that frozen treats are plain water only, and skip the food rounds if your dog guards food.
