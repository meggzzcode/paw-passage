description: A 1920s bungalow in the Pierpont Bay neighborhood of Ventura, California, with two bedrooms and a bath that sleeps 6, a patio, a garden and an outdoor play area. Ventura City Beach is about a 2-minute walk, and San Buenaventura State Beach about 5 minutes. The Vrbo page allows 2 dogs in total with a maximum weight of 999 lb per pet, effectively no limit, and the listing title says dogs stay free, though the page itself shows no fee detail. It does not say whether the yard is fenced. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
