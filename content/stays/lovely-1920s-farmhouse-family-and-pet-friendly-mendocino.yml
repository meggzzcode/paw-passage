summary: Three-bedroom farmhouse near Mendocino Headlands with a garden; listing allows 2 dogs.
description: A three-bedroom farmhouse in a rural pocket of Mendocino that sleeps 6 across two queen beds and a double, with a crib on the list, and one bathroom. The listing shows a deck or patio, porch, garden, outdoor play area, kitchen, dining area, barbecue grill, washer and onsite parking, and puts both Mendocino Headlands and Van Damme state parks about an eight-minute walk away. The Vrbo FAQ allows 2 dogs in total; it states no weight limit or pet fee, and the listing itself does not say the yard is fenced. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
