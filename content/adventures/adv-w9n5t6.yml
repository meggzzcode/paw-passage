title: Tourists in Our Own Town
clue: You live here, but today you are on vacation.
reveal: Act like visitors in your own neighborhood. Choose three sights a tourist would photograph, visit them at your dog's pace and send home a postcard from the trip. Your dog is the local guide.
objective: Visit three sights near home like tourists and write a postcard about the trip.
instructions:
  - "Pick three places a tourist would photograph: a mural, a fountain, a shop front, an old tree, a bench with a view. Choose a corner of town you know less well if you like, but keep all three within a short, comfortable walk and check that none needs steep kerbs or stairs."
  - Write the itinerary on a card and give your dog a tourist name, such as Signora Biscuit. A name only, with no costume.
  - "Walk to the first stop like a visitor: slow down, look up and read the signs. Let your dog sniff for as long as they like."
  - At each stop take one tourist photo and write down what a visitor would notice that you never have.
  - Skip a stop if it is crowded, loud or your dog is tired. Two stops out of three still counts.
  - Back home or on a bench, write the postcard. Name the Top Sight, which is the stop where your dog sniffed longest.
twist: "You are the visitors and your dog is the local expert: the stop they sniff longest is crowned Top Sight of the trip."
variations:
  - "Gentle: choose three sights on one block."
  - "From home: tour three views from your balcony or front window."
  - "On a road trip: run the same game at a rest stop or in a town you pass through."
completion: You have visited two or three stops and written the postcard.
photoIdea: A tourist photo at the Top Sight with your dog in the frame, relaxed and not posed.
memoryPrompt: Which of the three sights surprised you most?
