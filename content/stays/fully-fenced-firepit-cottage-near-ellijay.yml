summary: Two-bedroom cottage near Ellijay with a fully fenced firepit area; dogs allowed, limit 4.
description: A small mountain cottage in rural Gilmer County for up to 4 guests, with one king bed in each of its two bedrooms and a single full bath. A photo caption on the Vrbo page says the firepit sits inside a fully fenced area, which is the clearest dog-yard statement we found. Dogs are allowed up to 4 in total and no weight limit is shown. Outdoors there is a patio, deck, porch, garden and barbecue grill, and the kitchen, washer and air conditioning are listed. The county fairgrounds are only minutes away. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
