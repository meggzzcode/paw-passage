description: A Pacific Beach house in San Diego with three bedrooms plus a small office, sleeping six across two queen beds, a double sofa bed and a twin futon. The listing counts two bathrooms, though a third shower-only bathroom section also appears. The Vrbo FAQ permits one dog of up to 50 lb and says some restrictions may apply; no pet fee amount is readable. The amenity list covers a deck or patio, barbecue grill, garden, outdoor play area, dog toys and air conditioning, and it is a short walk to Pacific Beach and the Mission Beach boardwalk. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
