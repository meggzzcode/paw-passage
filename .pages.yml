# Pages CMS configuration (https://pagescms.org/docs/configuration/).
# This file tells Pages CMS what forms to show for each kind of content. It only ever edits the
# files in /content and the photos in /public/uploads. It cannot change the website's code.
#
# STATUS: the guides, products, affiliate and settings forms were opened in the live Pages CMS app on 2026-11-25
# (Cowork preflight: every form loads, no configuration error; nothing was saved). The full edit, save and publish loop
# is NOT yet verified.

# Keep any setting in a file that this form doesn't know about, instead of deleting it on save.
settings:
  content:
    merge: true

# Photos the editor uploads are saved here and appear on the site at /uploads/<file name>.
media:
  input: public/uploads
  output: /uploads
  categories: [image]

content:
  # ---------------------------------------------------------------- Articles
  - name: guides
    label: Articles
    type: collection
    path: content/guides
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, status, lastReviewed]
      primary: title
      sort: [lastReviewed, title]
      default:
        sort: lastReviewed
        order: desc
    fields:
      - name: status
        label: Status
        type: select
        required: true
        description: "Keep on Draft while you write. An article goes live only when it is Published AND has an 'Approved by' name and date below."
        options:
          values:
            - { value: draft, label: "Draft (not on the website)" }
            - { value: published, label: "Published (live once approved below)" }
      - name: approvedBy
        label: Approved by
        type: string
        description: "Type the name of the person who checked this article and approved it for the website. Leave empty until approved."
      - name: approvedOn
        label: Approved on
        type: date
        description: "The day it was approved. Leave empty until approved."
      - name: title
        label: Title
        type: string
        required: true
      - name: dek
        label: One-line summary (shown under the title)
        type: text
        required: true
      - name: category
        label: Type of article
        type: select
        required: true
        options:
          values: [Planning, Checklist, Gear]
      - name: author
        label: Author name shown on the article
        type: string
        required: true
      - name: publishedOn
        label: First published on
        type: date
        required: true
      - name: lastReviewed
        label: Last checked on
        type: date
        required: true
      - name: readingMinutes
        label: Reading time (minutes)
        type: number
        required: true
      - name: seoTitle
        label: Title for Google (60 characters or fewer)
        type: string
        required: true
        options:
          maxlength: 60
      - name: seoDescription
        label: Description for Google (160 characters or fewer)
        type: text
        required: true
        options:
          maxlength: 160
      - name: layout
        label: Page layout
        type: select
        description: "Use Emergency only for action-first pages (hides the top photo so the first steps show on the first screen)."
        options:
          values:
            - standard
            - emergency
      - name: heroImage
        label: Top photo (choose one of the built-in photos)
        type: select
        description: "Use this OR upload your own photo in the next box."
        options:
          values:
            - gear-car-safety
            - gear-first-aid
            - gear-portable-fence
            - guide-cold-weather-gear
            - guide-dog-hiking-gear
            - guide-dog-life-jacket
            - guide-keep-dog-cool
            - guide-loose-dog
            - guide-packing-list-boots
            - guide-protect-car-interior
            - guide-ramp-steps
            - guide-travel-bowls
            - guide-two-large-dogs-car
      - name: heroUpload
        label: Top photo (upload your own - replaces the built-in photo)
        type: image
        description: "Use a landscape photo about 1600 pixels wide and under 400 KB. You must have the right to use it."
      - name: heroAlt
        label: Describe the top photo (for screen readers)
        type: string
      # The article text is edited as plain Markdown on purpose. The visual (rich-text) editor was tested live on
      # 2026-11-17 and silently turned tick-box lists ("- [ ]" / "- [x]") into plain bullets, and 9 of the 16
      # articles use them. A plain-text editor never rewrites what it was not asked to change.
      # (Written from the Pages CMS docs; the "format: markdown" setting is documented for the code field.)
      - name: body
        label: "Article text (written in Markdown)"
        type: code
        options:
          format: markdown
        description: "List every source in the Sources field below. In the text, link a publisher only where the sentence names it, like [AKC](https://...), and only to an address in that list. Tick boxes are written - [ ] and - [x]. An affiliate link is written [the words](aff:short-name), using a short name from Affiliate links; it shows as a link only once that link is Approved."
      - name: faqs
        label: Questions and answers at the end
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string, required: true }
          - { name: a, label: Answer, type: text, required: true }
      - name: sources
        label: Sources (shown at the end of the article)
        type: object
        list: true
        description: "Every source you rely on goes here; it is printed in the Sources list at the end of the article."
        fields:
          - { name: title, label: Page title, type: string, required: true }
          - { name: url, label: Web address, type: string, required: true }
          - { name: publisher, label: Who published it, type: string, required: true }
          - { name: accessedOn, label: Date you checked it, type: date, required: true }
      - name: relatedGuides
        label: Related articles (the web-address names of other articles)
        type: string
        list: true
      - name: relatedProducts
        label: "Gear for this trip (product ids from the Products file, at most 4; shown after the article)"
        type: string
        list: true
      - name: relatedTools
        label: Related tools
        type: select
        list: true
        options:
          values: [packing-list]
      - name: gear
        label: Product picks (gear articles only)
        type: object
        list: true
        fields:
          - { name: productId, label: Product id, type: string, required: true }
          - { name: bestFor, label: Best for, type: string, required: true }
          - { name: whyItMadeTheList, label: Why it made the list, type: text, required: true }
          - { name: watchOuts, label: Things to check before buying, type: string, list: true }
      - name: research
        label: Research notes (how this article was checked)
        type: object
        fields:
          - {
              name: researchComplete,
              label: "Fact-checking finished? (must be ticked for the article to go live)",
              type: boolean,
            }
          - {
              name: unverified,
              label: "Claims still unchecked (must be empty for the article to go live)",
              type: string,
              list: true,
            }
          - { name: primaryKeyword, label: Main search phrase, type: string, required: true }
          - { name: relatedKeywords, label: Other search phrases, type: string, list: true }
          - { name: readerQuestions, label: Questions readers ask, type: string, list: true }
          - { name: intendedReader, label: Who this is for, type: text, required: true }
          - { name: angle, label: What makes this article different, type: text, required: true }
          - { name: gapsFound, label: Gaps found in other articles, type: string, list: true }
          - { name: differentiators, label: What we add, type: string, list: true }
          - {
              name: followUps,
              label: Open follow-ups (must be empty for the article to go live),
              type: string,
              list: true,
            }
          - name: competitors
            label: Other articles we read
            type: object
            list: true
            fields:
              - { name: url, label: Web address, type: string, required: true }
              - { name: title, label: Title, type: string, required: true }
              - { name: checkedOn, label: Date read, type: date, required: true }
              - { name: coversWell, label: What it covers well, type: text, required: true }
              - { name: gaps, label: What it misses, type: text, required: true }

  # ---------------------------------------------------------- Affiliate links
  - name: affiliates
    label: Affiliate links
    type: file
    path: content/affiliates.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: links
        label: "Links (a Buy button shows only for links marked Approved)"
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short name (lowercase letters, numbers and hyphens). For a product, use the product's id exactly for example kurgo-heather-hammock",
              type: string,
              required: true,
            }
          - {
              name: network,
              label: "Company (e.g. Amazon Associates)",
              type: string,
              required: true,
            }
          - {
              name: url,
              label: "Your affiliate link (starts with https://)",
              type: string,
              required: true,
            }
          - {
              name: approved,
              label: "Approved? (tick only after the company approved you)",
              type: boolean,
            }
          - { name: notes, label: Notes to yourself, type: text }

  # ------------------------------------------------------------ Products (gear)
  - name: products
    label: Products (travel essentials)
    type: file
    path: content/products.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: products
        label: "Products. No prices, ratings or 'tested' claims. A category page appears once it has 3 active products."
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short name (lowercase letters, numbers and hyphens). Never change it once a guide or an affiliate link uses it",
              type: string,
              required: true,
            }
          - { name: name, label: Product name, type: string, required: true }
          - { name: brand, label: Brand, type: string, required: true }
          - {
              name: aliases,
              label: "Other exact spellings of the name used in guide text, one per line (for example iCrate). Each links to the affiliate link while the product earns. Never a brand alone or one common word",
              type: string,
              list: true,
            }
          - {
              name: cardSpecs,
              label: "Spec card chips: up to three short facts (28 characters each), taken from this product's own record",
              type: string,
              list: true,
            }
          - name: categories
            label: "Categories (the first one is the main one; add at most one more as a cross-listing)"
            type: select
            list: true
            required: true
            options:
              values:
                - { value: car-safety, label: "Car safety and restraints" }
                - { value: car-interior, label: "Seat covers and cargo liners" }
                - { value: ramps-and-steps, label: "Ramps and steps" }
                - { value: feeding-and-hydration, label: "Bowls, bottles and food storage" }
                - { value: pens-and-gates, label: "Pens, fences and gates" }
                - { value: comfort-and-cooling, label: "Beds, comfort and cooling" }
                - { value: water-and-beach, label: "Life jackets and water safety" }
                - { value: trail-and-hiking, label: "Trail and hiking gear" }
                - { value: cold-weather, label: "Cold-weather gear" }
                - { value: safety-id-first-aid, label: "ID, GPS and first aid" }
                - { value: cleanup-and-protection, label: "Cleanup and protection" }
          - { name: summary, label: "What it is, in plain words", type: text, required: true }
          - {
              name: keySpecs,
              label: "What the maker states (one fact per line, taken from the source below)",
              type: string,
              list: true,
            }
          - name: specSource
            label: Where the facts came from
            type: object
            fields:
              - { name: title, label: Page title, type: string, required: true }
              - {
                  name: url,
                  label: "Page address (starts with https://)",
                  type: string,
                  required: true,
                }
              - { name: publisher, label: Publisher, type: string, required: true }
              - {
                  name: accessedOn,
                  label: "Date you read it (YYYY-MM-DD)",
                  type: string,
                  required: true,
                }
          - {
              name: manufacturerUrl,
              label: "Maker's page for this product (plain link, starts with https://)",
              type: string,
            }
          - {
              name: retailerUrl,
              label: "A plain retailer page (not an affiliate link). Used only if there is no maker page",
              type: string,
            }
          - { name: retailerName, label: "Retailer name (for the button)", type: string }
          - {
              name: lastVerified,
              label: "Date you last re-read the source page (YYYY-MM-DD)",
              type: string,
              required: true,
            }
          - {
              name: active,
              label: "Show this product? (untick to hide it everywhere but keep the record)",
              type: boolean,
            }
          - {
              name: imageSource,
              label: "Photo credit or source. Leave EMPTY (no photo) unless you have written permission or took the photo yourself",
              type: string,
            }
          - name: imageRights
            label: "Photo rights. 'none' = the card has no photo"
            type: select
            options:
              values:
                - { value: none, label: "None (no photo)" }
                - { value: permitted, label: "Written permission from the maker or photographer" }
                - { value: own, label: "My own photo" }
          - {
              name: affiliateProgram,
              label: "Affiliate program: the NAME of an entry in Affiliate links. Leave EMPTY unless that entry exists and is approved. Never paste a link or an ID here",
              type: string,
            }
          - {
              name: affiliateTrackingId,
              label: "Tracked link: the NAME of the entry in Affiliate links that holds this product's link. Leave EMPTY until approved. Change the link itself in Affiliate links, never here",
              type: string,
            }
          - name: alternativeRetailer
            label: "Another seller (plain link, not an affiliate link). Optional"
            type: object
            fields:
              - { name: name, label: Seller name, type: string }
              - { name: url, label: "Page address (starts with https://)", type: string }
          - {
              name: relatedGuides,
              label: "Guides worth reading with it (guide web address, for example dog-friendly-cabin-packing-list)",
              type: string,
              list: true,
            }
          - {
              name: manufacturerClaimsVsIndependentTesting,
              label: "Maker's claims versus independent testing. Write 'none cited' unless a named independent tester is cited with its source",
              type: text,
            }

  # ------------------------------------------------------------ Packing planner
  # The dog packing list planner at /tools/packing-list. Edit content/packing.yml directly (the verified route) or through this
  # form (the form is checked by tests but has not been walked through in the live Pages CMS).
  # Product ids are typed, not picked from a list (Pages CMS can only reference collections, not a file); the build checks every id.
  - name: packing
    label: Packing planner (dog packing list)
    type: file
    path: content/packing.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: tripTypes
        label: "Trip types (the cards in step 1). Change wording freely; keep the Short name and the Short id as they are once items use them"
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short id (lowercase letters, numbers and hyphens). Never change it once an item uses it",
              type: string,
              required: true,
            }
          - { name: label, label: "Card title", type: string, required: true }
          - {
              name: short,
              label: "Short name used in sentences (for example cabin, road trip)",
              type: string,
              required: true,
            }
          - {
              name: listTitle,
              label: "Heading of the finished list (for example Your cabin getaway packing list)",
              type: string,
              required: true,
            }
          - { name: hint, label: "One short line under the title", type: string }
          - name: icon
            label: Icon
            type: select
            required: true
            options:
              values:
                - { value: house, label: House }
                - { value: car, label: Car }
                - { value: waves, label: Waves }
                - { value: tent, label: Tent }
                - { value: compass, label: Compass }
          - name: gearTrip
            label: "Gear collection the 'Explore more travel gear' link opens (leave empty for the main Gear page)"
            type: select
            options:
              values:
                - { value: cabin-stay, label: Cabin stay }
                - { value: road-trip, label: Road trip }
                - { value: beach-and-lake, label: Beach and lake }
                - { value: winter-trip, label: Winter trip }
                - { value: hiking, label: Hiking }
          - name: implies
            label: "Conditions this trip type always includes (for example a road trip includes 'driving')"
            type: select
            list: true
            options:
              values:
                - { value: driving, label: "We're driving" }
                - { value: outdoors, label: "Hiking or outdoors" }
                - { value: water, label: "Beach, lake or swimming" }
                - { value: cold, label: "Cold or snowy weather" }
                - { value: hot, label: "Hot weather" }
                - { value: senior, label: "Older dog or mobility considerations" }
                - { value: no-fence, label: "No securely fenced yard" }
                - { value: escape-risk, label: "A dog who may slip away" }
                - { value: medication, label: "Medication or special supplies" }
      - name: conditions
        label: "Plan-for options (the tick boxes in step 4). Add one only together with the items that use it"
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short id. Never change it once an item uses it",
              type: string,
              required: true,
            }
          - { name: label, label: "What the visitor sees", type: string, required: true }
          - { name: hint, label: "Optional small hint", type: string }
      - name: categories
        label: "Categories (headings on the finished list). Only categories that have items are shown"
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short id. Never change it once an item uses it",
              type: string,
              required: true,
            }
          - { name: label, label: "Heading", type: string, required: true }
          - { name: order, label: "Order (smaller comes first)", type: number, required: true }
      - name: items
        label: "Items. No prices, ratings or 'tested' claims. A mistake stops the build and names the item and field"
        type: object
        list: true
        fields:
          - {
              name: id,
              label: "Short id (lowercase letters, numbers and hyphens). Never change it once someone may have saved a list",
              type: string,
              required: true,
            }
          - { name: name, label: Item name, type: string, required: true }
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: food-water, label: "Food and water" }
                - { value: leash-id-safety, label: "Leashes, ID and safety" }
                - { value: sleep-comfort, label: "Sleep and comfort" }
                - { value: car-travel, label: "Car and travel" }
                - { value: outdoor, label: "Outdoor adventures" }
                - { value: health, label: "Health and medication" }
                - { value: rental, label: "Cabin and rental essentials" }
          - { name: order, label: "Order inside its category (smaller comes first)", type: number }
          - {
              name: what,
              label: "What is this for? (one short sentence shown under the name)",
              type: text,
              required: true,
            }
          - {
              name: why,
              label: "Why bring this? (shown when the visitor opens 'Why bring this?')",
              type: text,
              required: true,
            }
          - { name: tip, label: "Extra tip (optional)", type: text }
          - name: appears
            label: "When should this appear?"
            type: select
            required: true
            options:
              values:
                - { value: essential, label: "Always: on every list" }
                - { value: conditional, label: "Only when the rule below matches the trip" }
                - {
                    value: optional,
                    label: "Offered as an idea, or as 'Consider' when the rule below matches",
                  }
          - name: when
            label: "The rule (leave empty for 'Always'). Every part you fill in must match"
            type: object
            fields:
              - name: tripTypes
                label: "Only for these trip types"
                type: select
                list: true
                options:
                  values:
                    - { value: cabin, label: "Cabin or vacation rental" }
                    - { value: road-trip, label: "Road trip" }
                    - { value: beach-lake, label: "Beach or lake getaway" }
                    - { value: camping-hiking, label: "Camping or hiking trip" }
                    - { value: other, label: "Other getaway" }
              - name: anyConditions
                label: "When at least one of these is ticked"
                type: select
                list: true
                options:
                  values:
                    - { value: driving, label: "We're driving" }
                    - { value: outdoors, label: "Hiking or outdoors" }
                    - { value: water, label: "Beach, lake or swimming" }
                    - { value: cold, label: "Cold or snowy weather" }
                    - { value: hot, label: "Hot weather" }
                    - { value: senior, label: "Older dog or mobility considerations" }
                    - { value: no-fence, label: "No securely fenced yard" }
                    - { value: escape-risk, label: "A dog who may slip away" }
                    - { value: medication, label: "Medication or special supplies" }
              - {
                  name: allConditions,
                  label: "When all of these are ticked",
                  type: select,
                  list: true,
                  options:
                    {
                      values:
                        [
                          { value: driving, label: "We're driving" },
                          { value: outdoors, label: "Hiking or outdoors" },
                          { value: water, label: "Beach, lake or swimming" },
                          { value: cold, label: "Cold or snowy weather" },
                          { value: hot, label: "Hot weather" },
                          { value: senior, label: "Older dog or mobility considerations" },
                          { value: no-fence, label: "No securely fenced yard" },
                          { value: escape-risk, label: "A dog who may slip away" },
                          { value: medication, label: "Medication or special supplies" },
                        ],
                    },
                }
              - {
                  name: unlessConditions,
                  label: "Not when any of these is ticked",
                  type: select,
                  list: true,
                  options:
                    {
                      values:
                        [
                          { value: driving, label: "We're driving" },
                          { value: outdoors, label: "Hiking or outdoors" },
                          { value: water, label: "Beach, lake or swimming" },
                          { value: cold, label: "Cold or snowy weather" },
                          { value: hot, label: "Hot weather" },
                          { value: senior, label: "Older dog or mobility considerations" },
                          { value: no-fence, label: "No securely fenced yard" },
                          { value: escape-risk, label: "A dog who may slip away" },
                          { value: medication, label: "Medication or special supplies" },
                        ],
                    },
                }
              - { name: minDays, label: "At least this many days", type: number }
              - { name: maxDays, label: "At most this many days", type: number }
          - name: quantity
            label: Quantity suggestion
            type: object
            fields:
              - name: strategy
                label: "How the number is worked out"
                type: select
                options:
                  values:
                    - { value: none, label: "No quantity" }
                    - { value: fixed, label: "A fixed number" }
                    - { value: perDog, label: "Per dog" }
                    - { value: perDay, label: "Per day" }
                    - { value: perDogPerDay, label: "Per dog per day" }
                    - { value: dogDays, label: "Dogs x days (for food)" }
                    - {
                        value: meals,
                        label: "Meal portions if the visitor gives meals per day, else dog-days (for food)",
                      }
                    - {
                        value: text,
                        label: "A short sentence instead of a number (for medication or water: never a dose or volume)",
                      }
              - { name: count, label: "The number (per dog, per day, or fixed)", type: number }
              - {
                  name: unit,
                  label: "What is counted, singular (for example bed, bag, bowl set)",
                  type: string,
                }
              - { name: min, label: "Never fewer than (optional)", type: number }
              - { name: max, label: "Never more than (optional)", type: number }
              - { name: text, label: "Sentence (only for the 'sentence' choice)", type: string }
              - {
                  name: note,
                  label: "Short note after the number (for example plus a spare)",
                  type: string,
                }
          - {
              name: shopFor,
              label: "What to call the product in 'Need a ...?' (for example travel bowl). Required when products are listed",
              type: string,
            }
          - name: gearCategory
            label: "Gear category to point to when no product is listed (needs 'What to call the product')"
            type: select
            options:
              values:
                - { value: car-safety, label: Car safety }
                - { value: car-interior, label: Car interior }
                - { value: ramps-and-steps, label: Ramps and steps }
                - { value: feeding-and-hydration, label: Feeding and hydration }
                - { value: pens-and-gates, label: Pens and gates }
                - { value: comfort-and-cooling, label: Comfort and cooling }
                - { value: water-and-beach, label: Water and beach }
                - { value: trail-and-hiking, label: Trail and hiking }
                - { value: cold-weather, label: Cold weather }
                - { value: safety-id-first-aid, label: Safety, ID and first aid }
                - { value: cleanup-and-protection, label: Cleanup and protection }
          - name: products
            label: "Related Gear products (at most 4; the first is the main suggestion, a second needs 'How it differs')"
            type: object
            list: true
            fields:
              - {
                  name: id,
                  label: "Product id exactly as written in Products (typed, not picked). The build stops if it is unknown or switched off",
                  type: string,
                  required: true,
                }
              - {
                  name: because,
                  label: "How it differs from the first (required for every product after the first)",
                  type: string,
                }
              - {
                  name: caution,
                  label: "The one thing to check before buying (size range, a limit, a maker warning). Never a claim about 'senior' or 'large' dogs unless the maker says it",
                  type: text,
                  required: true,
