lifeStages: ["puppy", "adult", "senior"]
energy: "gentle"
mobilityFriendly: true
crowd: "none"
otherDogs: false
seasons: []
safety:
  - "Keep hot drinks well away from your dog and use a cup that cannot easily tip."
  - "Watch for thunder or loud noises, and move away from the window if your dog seems anxious."
variations:
  - "No rain? Use any busy window, or watch the snow, dusk or birds at a feeder."
  - "For a dog who prefers a bed: bring the bed to the window."
memoryPrompt: "What was on the cafe menu, and what did your dog watch most?"
