description: A one-bedroom cottage in the Point Loma and Ocean Beach part of San Diego, with a queen bed and a double sofa bed for up to four guests and a single shower-only bathroom. The Vrbo FAQ allows cats and dogs with a limit of one pet and a maximum of 50 lb, and warns that some restrictions may apply. Photos show a gated entrance, but the page gives no fence description or fee. Amenities include a patio, barbecue grill, air conditioning and beach equipment, and the town beach and Dog Beach are a short walk away. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
