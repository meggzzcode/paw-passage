title: The Family Storybook Afternoon
clue: "By teatime there will be a book nobody has read, written about someone who was in the room all along."
reveal: "Your family writes a tiny picture book about a real afternoon with your dog. Three calm watching moments become three pages, a fourth page holds the ending, and the finished book is read aloud once, quietly, to the hero."
objective: "Watch your dog at three calm moments across an afternoon, turn each into a page of a folded paper book and read it aloud to your dog."
instructions:
  - "Fold one sheet of paper into a small eight-page booklet (fold in half three times, or stack and fold four sheets). Pick a working title and a hero name, such as your dog's own name. An adult sets up a cozy spot with paper and pens at least 6 feet from where your dog likes to rest, and stays in the room while the book is being made."
  - "Moment one: watch quietly for a few minutes at the start of the afternoon. Each person writes or draws one sentence or one picture about what the hero did, such as arriving in the room, sniffing, stretching or choosing a spot. Make it a gentle story, never an order or a lesson for the dog. Do not call, pose or follow the dog."
  - "Go and do something else for a while, then come back for moment two. Whatever the hero is doing now becomes page two. If they are sleeping, that is a very good page: write about the dream."
  - "Moment three comes when the hero settles for the afternoon, or leaves. Everyone adds a last page together: the ending. Add a title page and a back-cover line from an adult. Do not write the children's names or ages in the book."
  - "Read the book aloud once, in a soft voice, from your cozy spot. Your dog may listen, nap, wander off or ignore it, and every choice is a fine one. Nobody hugs, lifts or reaches for them."
  - "Leave the finished book on a shelf where the dog's resting place is in view. Tidy the pens away and let the hero rest."
twist: "Nothing in the story is invented about the dog. Every page comes from something the hero really chose to do."
variations:
  - "For young children: draw one picture each instead of writing, and let an adult write the words underneath."
  - "For a puppy: watch for one short moment at a time, and write the pages while the puppy naps."
  - "For a senior or limited-mobility dog: let them stay on their own bed all afternoon. Their story is about a long nap."
  - "For a quiet household of two: take turns, one watching while the other writes."
completion: "The family has written three real moments and an ending into a booklet and read it aloud once to your dog."
photoIdea: "The finished booklet open beside the dog's resting place, no faces needed."
memoryPrompt: "Which page was the favorite in your dog's story?"
