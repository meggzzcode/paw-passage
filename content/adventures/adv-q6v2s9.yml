title: The Secret Detective Agency
clue: A case has landed on the desk, and the only detective on staff has a very good nose.
reveal: Something has gone missing at home. Lay a short, safe scent trail through a room or two and let your dog crack the case at their own pace. An ID card is optional.
objective: Lay a short scent trail that ends at a hidden toy and let your dog solve the case.
instructions:
  - "Optional: on an index card write a code name for your dog and Case No. 1, with a corner left for a photo."
  - "Choose the missing item: one favorite toy. Show it to your dog, then move your dog to another room or behind a gate while you set up."
  - "Lay the trail: rub the toy and then a clean, worn sock along the floor in a line with two or three clue spots, for example a sofa leg and a doorway, ending at the hiding place. Skip anything strongly scented."
  - "Hide the toy low and easy: behind a cushion with a corner showing, or beside a chair leg. No jumping, climbing or reaching. A first case should be solved in under two minutes."
  - "Open the case: bring your dog in with a calm case word, stay quiet and do not point. Let them follow their nose at their own pace. If they stall, walk a step toward the first clue yourself rather than leading them."
  - "Case closed: celebrate the find and let them keep the toy. Write one line in the case file: the clues and the detective's method."
twist: "Your dog is the detective and you play the crime scene: the praise is the pay."
variations:
  - "Very gentle: lay the trail on one rug with the toy a few steps away."
  - "For a lively dog: lay a longer trail across two rooms and add a second hidden toy for a two-part case."
  - "For a dog who loves a longer hunt: hide a second favorite toy or a rolled-up towel with the toy tucked in a fold, with no food involved."
  - "For a dog who is not toy-motivated: hide their favorite blanket instead."
completion: The detective finds the hidden item and the case file has its first entry.
photoIdea: A calm portrait of your dog beside the found toy and the case file, taken once the case is closed and they are relaxed.
memoryPrompt: What was the case, and what was the detective's method?
