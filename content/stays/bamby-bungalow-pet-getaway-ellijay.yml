description: A cabin on a river outside Ellijay that sleeps 8 across a king room, a queen room, a twin room and a sofa bed, with two bathrooms. The title advertises a fenced-in yard and few stairs, a photo caption describes a gated deck that keeps pets contained, and the amenities include a hot tub, balcony, pool access, toys and parking. The Vrbo FAQ allows dogs with a limit of 2 in total and gives no maximum weight or fee. Riverside Park is a couple of minutes away by car. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
