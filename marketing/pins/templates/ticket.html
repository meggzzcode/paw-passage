<style>
  .t {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .tk {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 6px solid var(--ink);
    box-shadow: 10px 10px 0 rgb(20 40 58/0.9);
    position: relative;
  }
  .tk .top {
    background: var(--accent);
    color: var(--on, #fffaf0);
    padding: 34px 48px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 30px;
    display: flex;
    justify-content: space-between;
  }
  .tk .mid {
    padding: 44px 48px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .tk .perf {
    border-top: 6px dashed var(--ink);
    margin: 0 -6px;
    position: relative;
  }
  .tk .perf:before,
  .tk .perf:after {
    content: "";
    position: absolute;
    top: -30px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--paper);
    border: 6px solid var(--ink);
  }
  .tk .perf:before {
    left: -30px;
  }
  .tk .perf:after {
    right: -30px;
  }
  .tk .art {
    flex: 1;
    min-height: 0;
    padding: 20px;
  }
</style>
<div class="pin">
  <div class="t">
    <div class="tk">
      <div class="top"><span>Admit one dog</span><span>{{kicker}}</span></div>
      <div class="mid">
        <h1 class="{{hsize}}">{{headline}}</h1>
        <p class="sub">{{sub}}</p>
      </div>
      <div class="perf"></div>
      <div class="art">{{art}}</div>
    </div>
    <div class="brand">
      <i></i>Paws &amp; Passage<span class="tag" style="margin-left: auto">{{tag}}</span>
    </div>
  </div>
</div>
