title: The Little Picnic Club
clue: "A blanket, a menu of mysteries and a guest who orders with their nose."
reveal: "Hold a small picnic where the menu is made of smells. Set out three scent courses on a blanket, let your dog choose the dish of the day by where they linger, then close the club with a toast and a picnic postcard."
objective: "Lay out a three-course scent menu on a blanket, let your dog choose the dish of the day, and write a picnic postcard."
instructions:
  - "Choose a theme from your dog: their coat colour, a favourite toy, the way they greet you or the sound of their name. Use it for the club name, such as The Red Dog Social."
  - "Choose a quiet spot where your dog is already relaxed: your yard, a patio, a balcony or a corner of the living room. Check the ground for hot surfaces, sharp bits and plants."
  - "Write the scent menu: three courses, each a smell that is safe and too big to swallow. For example a large fallen leaf from outside, a clean cloth that has been near the kitchen window, and a T-shirt you have worn. Lay each course on its own corner of the blanket with space between them."
  - "Let your dog arrive in their own time and take the menu in any order. Do not point or lead. They can sniff, skip a course or leave the blanket, and the picnic works every way."
  - "Watch for the dish of the day: the course they linger over longest. Put the other two away and give the winner the middle of the blanket. Sit down on the far side with your own snack, out of reach of your dog's nose."
  - "Close the club with a toast: clink your cup against the rim of their water bowl, say the club name once, then write a postcard to your future selves with the theme, the dish of the day and what your dog did first on the blanket."
twist: "The picnic menu is made of smells, not food: your dog orders the dish of the day with their nose, and the toast comes last."
variations:
  - "Rain version: lay the blanket on the living-room floor and open a window."
  - "For a nervous dog: use your own yard or balcony, offer only one course and keep it to ten minutes."
  - "For a lively dog: add a fourth course that is their favourite toy."
  - "For limited mobility: picnic from a chair on a porch or patio with the blanket beside you and the three courses within a few steps."
completion: "Your dog has chosen a dish of the day, you have toasted the club and written the postcard."
photoIdea: "Your dog investigating the scent menu on the blanket, taken from their eye level."
memoryPrompt: "What was the theme, and which course did your dog choose?"
