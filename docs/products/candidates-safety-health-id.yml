candidates:
  - id: my-medic-pet-medic-dog-first-aid-kit
    name: Pet Medic Dog First Aid Kit
    brand: My Medic
    categories: [travel-safety]
    summary: A water-resistant ripstop-bag dog kit whose page itemizes every component with a quantity, including a muzzle and a syringe.
    keySpecs:
      - 'Maker headline claim: "29 first aid supplies"; the itemized list on the same page adds to about 23 units (about 28 if the six parts of the gauze module are counted), so the headline is the maker claim, not a count we could reproduce'
      - "Itemized: 2 diphenhydramine pills, triangular bandage, 2 inch elastic bandage, tweezer, space blanket, mini gauze module, 1 pair gloves, hydrogen peroxide spray, 30 mL syringe, dog muzzle, 5 triple antibiotic packets, 5 antiseptic wipes, printed pet first aid guide, digital guide download card"
      - "Includes medication items (diphenhydramine, hydrogen peroxide, triple antibiotic); the page gives no dosing guidance beyond the included guide, so the article should tell readers to ask their own vet about these"
      - "Weight listed as 10.25 oz; dimensions 7.5 in high x 5.25 in wide x 3.5 in deep"
    specSource: {title: Pet Medic - Dog First Aid Kit, url: "https://mymedic.com/products/pet-medic-dog-first-aid-kit", publisher: My Medic, accessedOn: 2026-11-18}
    manufacturerUrl: https://mymedic.com/products/pet-medic-dog-first-aid-kit
    lastVerified: 2026-11-18
    active: false
    manufacturerClaimsVsIndependentTesting: "No independent test cited. Piece count is a maker claim that does not match its own itemized list."
    relatedGuides: [dog-travel-first-aid-kit-guide]
    valueRole: best-overall
    whyItFitsTravel: A pouch-sized kit that lists quantities and weight, so a reader can compare it line by line against the AVMA checklist already in the guide.
    valueEvidence: "Maker page gives per-item quantities, weight and dimensions (rare among kits). Contrast with the headline count that does not match the list, which the guide can show as a worked example of checking contents."
    articlePlacement: "dog-travel-first-aid-kit-guide, in the product comparison next to the two Kurgo kits and AMK kits; use the 29-vs-itemized gap as the 'count the list, not the headline' example."
    amazonCheck: "Confirm the listing is the Pet Medic dog kit (not the Med Pack or the Everyday Rescue bundle), is sold by My Medic or Amazon, and that the contents photo matches the maker list above (muzzle and syringe present). Not confirmed: whether current stock matches the page."
