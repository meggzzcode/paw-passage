summary: Three-bedroom Tybee Island home near the beach; up to 3 dogs, no practical weight limit listed.
description: A three-bedroom house in the South Beach area of Tybee Island, Georgia, that sleeps 9 with a king, a queen, bunk beds and a sofa bed. It has a deck or patio, a garden, an outdoor play area, a barbecue grill and air conditioning, and the listing title promises a privacy fence. The Vrbo page allows up to 3 dogs in total and sets the per-pet weight cap at 999 lb, which in practice means no weight limit. It shows no pet fee, so the cost of bringing dogs is not confirmed. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
