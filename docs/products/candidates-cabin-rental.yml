  - id: bearvault-bv450-jaunt
    name: BV450 Jaunt Bear Canister
    brand: BearVault
    categories: [cabin-vacations, outdoor-adventures, feeding-and-hydration]
    summary: A hard-sided, screw-lid food canister that the maker lists as passing IGBC grizzly testing, made for backcountry use.
    keySpecs:
      - Maker's testing page lists the BV450 as IGBC certified (No. 5339) and WMI certified (No. BB0022)
      - Maker page says "Every model must withstand over 60 minutes of active bear contact without access"
      - IGBC itself says certification does not make a product bear-proof and it must be used correctly, such as locked
      - Weight, volume and material not read on the product page this session (page text had no specs)
    specSource: {title: Bear Canister Testing, url: "https://bearvault.com/pages/bear-testing", publisher: BearVault, accessedOn: 2026-11-18}
    manufacturerUrl: "https://bearvault.com/products/bv450"
    lastVerified: 2026-11-18
    active: false
    manufacturerClaimsVsIndependentTesting: IGBC and WMI certification is stated on the maker's page; IGBC's own page was read and does not list this product, so confirm the number on the official IGBC list before quoting it. The product page quotes IGBC #5340 per a search snippet, so the number is inconsistent across sources.
    relatedGuides: [dog-friendly-cabin-packing-list]
    valueRole: best-overall
    whyItFitsTravel: Dog food smells attract bears and rodents; some cabin areas ask guests to store food in certified containers.
    valueEvidence: Named testing bodies (IGBC, WMI) cited by the maker; IGBC program page read. No reviewer cited for value.
    articlePlacement: "dog-friendly-cabin-packing-list, new 'Cabins in bear country' note beside the existing food-storage picks; only if the host or land manager's rules mention bears."
    amazonCheck: Confirm exact model BV450, that the listing is sold by BearVault or Amazon, and the certification number on the IGBC list. Confirm capacity fits a dog's food for the stay; it is sized for a person's food.
