safety:
  - Check the weather and the ground first. Keep your dog out of strong sun and off hot surfaces, and bring shade and water.
  - Keep your own food out of reach and check that nothing on the ground is something your dog should not chew.
  - Choose scent courses that are clean, non-toxic and too large to swallow, and take away anything your dog starts to chew.
  - Choose a spot where your dog can move away from the blanket whenever they like.
  - Keep to your own yard, patio or balcony by default. At a park corner, leave at once if other dogs or people turn up and your dog seems unsettled.
  - For a puppy, check with your vet about vaccination and readiness before any public outing, and keep to your own yard or home until then.
