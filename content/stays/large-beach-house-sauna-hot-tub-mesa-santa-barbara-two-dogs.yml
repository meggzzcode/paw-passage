summary: Four-bedroom Santa Barbara house with a hot tub and sauna; 2 dogs up to 50 lbs, Leadbetter Beach 8 minutes on foot.
description: A four-bedroom house in the Mesa area of Santa Barbara that sleeps 8, with two king beds, two queen beds and a sofa bed, and three bathrooms. The listing advertises a hot tub and a sauna, plus a patio, garden, barbecue grill and air conditioning. The Vrbo FAQ allows two dogs up to 50 lbs each; no pet fee or fence detail is readable. The listing places Leadbetter Beach and Shoreline Park within a short walk. Guests mention steep entry stairs. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
