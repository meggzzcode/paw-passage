title: The Great Doggy Taste-Off
clue: Three entries, one very honest judge and not an oven mitt in sight.
reveal: "Stage a tiny taste-off at your own kitchen counter with three plates made only from foods your dog already eats well. Your dog is the only judge: present each entry, let their nose decide and name a winner."
objective: Set up three small entries made from foods your dog already eats, let your dog judge them and name a winner.
instructions:
  - Plan three tiny entries using only foods your dog already eats well, such as their usual treats or foods your vet is happy with. Nothing new today.
  - "Make the entries. The Showstopper: five tiny pieces of their usual treat arranged like a flower on a plate. The Frozen Fancy: one usual treat frozen in an ice cube tray of plain water only (no juice or broth). The Lick-Off: a thin smear of a spread your dog already eats, with no xylitol, on a plate or lick mat."
  - Decide the total first and keep it small. Take what you use out of today's meal portions, and ask your vet about diet if you are unsure.
  - "Open the bakery: set a counter on a non-slip floor and name each entry out loud as you serve it. Present one entry at a time and let your dog come to it in their own time. Remove each plate when they finish or walk away."
  - "Score by your dog's behavior: what they sniffed first, ate most eagerly and stayed with longest. Pick the winner and say it out loud."
  - Clear every plate away, wash the dishes and jot down the winner on a sticky note for the fridge.
twist: "Nothing is baked and the oven stays off: it is a tasting contest of foods your dog already enjoys, and the judge's only scoring tool is their own nose."
variations:
  - "No-food version, the Sniff-Off: three safe sniffables on plates (a clean sock, a dry leaf, a scrap of cloth) judged the same way."
  - "For a dog on a special diet: use their usual meal in three small portions plated differently, after asking your vet."
  - "For a puppy: use tiny pieces and run one entry only."
completion: Your dog has judged all three entries, or as many as they wanted, and there is a winner.
photoIdea: Your dog at the judge's table sniffing the winning entry, taken at their eye level.
memoryPrompt: Which entry won, and what did the judge do first?
