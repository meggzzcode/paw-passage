description: One-bedroom, one-bath cottage for up to 2 guests in a wooded mountain setting near McCaysville, with a kitchenette, a barbecue grill and a French-themed look described by guests. The listing says cats and dogs are allowed, with a limit of 3 pets in total. It does not state a pet fee, weight limit, breed rules, fenced yard or hot tub, and guest reviews say the only shower is outdoors. On 2026-11-18 we read the Vrbo listing (its Policies section was cut off in what we could load) and a Bookabach copy that matches on title, McCaysville, 1 bedroom for 2 and the same listing number; both state only the cats and dogs limit of 3 and say nothing about pet fee, weight limit, breed rules or fenced yard. An Expedia copy could not be loaded (rate limited). Nothing has been confirmed with the host.
