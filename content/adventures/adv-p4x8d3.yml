safety:
  - "Check the weather and the ground first, and keep your dog out of strong sun or on hot surfaces. Bring shade and water."
  - "Keep your own food out of reach and check that plants or items on the ground are not something your dog should chew."
variations:
  - "Mobility-friendly: picnic on a patio, porch or balcony, or in the car park beside the car with the door open."
  - "If other dogs make your dog uneasy, choose a quiet corner or your own yard."
memoryPrompt: "What was the theme, and what did your dog do first on the blanket?"
