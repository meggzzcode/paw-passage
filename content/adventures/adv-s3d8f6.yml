title: The Secret Handshake Club
clue: Every club needs a secret greeting, and this one is invented by its newest member.
reveal: "Invent a greeting with your dog from whatever they already offer: a paw lift, a nose bump, a head tilt. You notice it, answer it and name it, and it becomes the club handshake. No asking and no pressure."
objective: Notice a greeting your dog offers on their own, answer it, name it and write it down.
instructions:
  - Choose a calm moment at home when your dog is relaxed near you. Sit or lie down at their level with no treats and no toys in hand.
  - "For about five minutes just watch for small things they do when they greet or check in with you: a paw lift, a nose touch to your hand, a head tilt, a stretch, a slow blink. Do not ask for anything."
  - "When you see one, answer it softly: hold out a still, open hand for a nose bump, or say a happy quiet club word. Only ever touch a paw that your dog has lifted themselves, and let go the moment they move it."
  - See whether they offer it again. If they do, you have a handshake. If they do not, drop it for the day. The handshake is only the one your dog repeats because they want to.
  - "Name it together, for example The Double Bump, and write it down with Rule One: only if the dog wants to."
  - Try it once more later in the day, for example at the door. If your dog brushes it off, they are voting no, and that is fine.
twist: The handshake is invented by your dog, not taught by you. You copy what they offer, so you are the one learning a trick.
variations:
  - "If your dog offers nothing: make the handshake your own, a slow blink and a soft word, and notice if they answer."
  - "For a dog who dislikes being touched: use only a nose bump to an open hand held still."
  - "For a senior or lying-down dog: do it side by side on the floor or the sofa."
  - "For a puppy: keep each session to a minute or two."
completion: You have named a handshake your dog offered, or agreed that there is nothing to name today, and written it down.
photoIdea: A calm moment of the handshake itself, such as the nose bump to your open hand, taken by someone else or with the phone propped nearby.
memoryPrompt: What is the handshake called, and who offered it first?
