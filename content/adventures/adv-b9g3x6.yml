id: "adv-b9g3x6"
title: "The Slow-Lane Sniffari"
clue: "Four metres can take half an hour when the nose is in charge."
description: "A gentle outing where your dog sets the route and the pace. Follow their nose for as long as they like, note what they find and keep a trail log of the smell stops."
instructions:
  - "Choose a quiet, familiar patch: a yard, a lane, a park edge or a patch of trail. Bring water."
  - "Let your dog lead and stop whenever they want to sniff. Do not tug or hurry them on."
  - "Mark each sniff stop in a notebook with a note or a quick sketch, and count the stops."
  - "End with a calm sit or a drink of water and name the most popular stop of the day."
twist: "Your dog is in charge of the route and the speed, so the destination is whatever smells interesting."
prep: "light"
supplies: ["Leash", "Water and a bowl", "Notebook"]
minutesMin: 10
minutesMax: 40
costMin: 0
costMax: 0
setting: "outdoor"
environments: ["house", "city", "countryside", "mountains"]
lifeStages: ["senior", "adult"]
energy: "gentle"
mobilityFriendly: true
crowd: "none"
otherDogs: false
seasons: []
safety:
  - "Let your dog go at their own pace and rest as often as they like. Follow your vet's guidance for your dog's needs."
  - "Check the ground and weather first, and carry water. Avoid hot pavement, ice and thin clothing in the cold."
variations:
  - "In your own yard or on the doorstep: bring the sniff stops to one small patch."
  - "On a day when your dog is stiff or tired, just sit together on a bench and let the smells come to you."
memoryPrompt: "What did your dog find most interesting today?"
