safety:
  - Stay on your doorstep or in your own yard with the leash on, and step back in if another dog appears.
  - Hand-test the ground at noon and skip it if too hot. Keep your hot drink out of reach and let nothing be eaten off the ground.
  - "Puppies: ask your vet before public outings and stay in your own yard until then."
