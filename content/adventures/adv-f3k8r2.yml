safety:
  - An adult stays in the room throughout. Children and the dog are never alone together; the group stays 6 feet back.
  - Nobody hugs, kisses, lifts, corners or leans over the dog. The dog may leave or retreat to rest at any time.
  - If your dog stiffens, lip licks, yawns, turns away or hides, end the club and give them space.
