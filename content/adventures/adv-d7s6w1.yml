safety:
  - "Choose quiet spots away from heavy traffic, and keep your dog on a leash. Leave if the noise upsets them."
  - "Let your dog move away from any sound that worries them."
variations:
  - "In place: map three sounds from your balcony or doorstep without going anywhere."
  - "Do the same from a bench in a quiet park on a different day to compare."
memoryPrompt: "Which sound did your dog notice that you almost missed?"
