dietNotes: Use only foods your dog already eats well and count them in the day's portions. No chocolate, xylitol, grapes, raisins, onion, garlic or macadamia nuts. Ask your vet about diet.
water: none
safety:
  - Use only foods your dog already eats well, and ask your vet about diet before changing anything.
  - Keep every piece tiny and stay with your dog the whole time.
  - If your dog guards food or gets tense around it, skip this one or do the no-food Sniff-Off.
  - Never use chocolate, xylitol sweeteners, grapes, raisins, onion, garlic or macadamia nuts.
