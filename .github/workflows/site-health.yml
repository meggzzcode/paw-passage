# Weekly health check for the live website.
#
# What it does, in plain words:
#   1. Runs the site's automatic tests.
#   2. Visits every page listed in the live sitemap and reports any that are missing or broken.
#   3. Looks for articles, places and data that are overdue for a re-check (rules in scripts/site-health.mjs).
# If something needs attention it opens a GitHub issue (and updates the same issue next week). When the
# problem is fixed the issue is closed automatically. GitHub emails the repository owner about issues.
# No passwords or secrets are used: only the automatic GITHUB_TOKEN that GitHub provides.
#
# Run it by hand any time: GitHub > Actions > "Site health" > "Run workflow".
name: Site health

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run the automatic tests
        run: npx vitest run
      - name: Check every page in the live sitemap
        if: always()
        run: node scripts/site-health.mjs links --out link-report.md
      - name: Check which content is overdue for a re-check
        if: always()
        run: node scripts/site-health.mjs freshness --out freshness-report.md
      - name: Open, update or close the issues
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const reports = [
              { file: "link-report.md", title: "Site health: broken or missing pages" },
              { file: "freshness-report.md", title: "Site health: content overdue for a re-check" },
            ];
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", labels: "site-health", per_page: 100,
            });
            for (const { file, title } of reports) {
              const existing = open.find((i) => i.title === title);
              if (fs.existsSync(file)) {
                const body = fs.readFileSync(file, "utf8") + "\n_Updated automatically by the weekly Site health workflow._";
                if (existing) {
                  await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
                } else {
                  await github.rest.issues.create({ ...context.repo, title, body, labels: ["site-health"] });
                }
              } else if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: "Fixed: this week's check found nothing. Closing." });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
              }
            }
