description: A three-bedroom, three-bathroom cabin in the Innsbruck area of Helen that sleeps 10, with a king in the main bedroom, a queen in another and two double bunks in the third. The amenity list shows a hot tub, a swimming pool, a deck, a grill, a fire pit, an electric vehicle charger and parking, and the main bath has a jetted tub. The Vrbo FAQ allows dogs and cats, 2 pets in total, up to 50 lb each, which suits a mid-size dog; no pet fee or fence is shown. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
