title: The Sunrise Breakfast Club
clue: "The world is quiet, the sky is changing colour and someone has left the morning paper under the blanket."
reveal: "Start the day with a dawn nose-round of a small patch near home, with your dog choosing which way to read the morning news. A favourite toy waits under the blanket at the club spot, and you finish with a warm drink and one sunrise photo."
objective: "Take a short dog-led sniff round at dawn, let your dog find the toy waiting at the club spot, and watch the sunrise from there."
instructions:
  - "The evening before, check tomorrow's sunrise time, set an alarm thirty minutes earlier and pick a comfortable club spot you can reach easily: a window seat, balcony, doorstep or yard edge. Tuck one of your dog's favourite toys under a folded corner of a blanket there, partly showing."
  - "In the morning, take your dog out on a leash or into an enclosed space for the morning round: three short stops within sight of home, such as the doorstep, the nearest tree and the garden edge. Stand still and let your dog choose which stop to read first and how long to stay. That is the morning news."
  - "Follow their nose rather than leading it. If they stop to sniff, wait. If they want to go home early, go home early."
  - "Walk to the club spot together. Let your dog find the toy under the blanket in their own time, and let them play with it or simply settle beside it."
  - "Settle in with your warm drink and put the phone away; it comes out once, for the single sunrise photo. Name three things you can see, hear or smell, taking turns, quietly."
  - "Close the club by leaving the toy on the blanket for your dog to keep for the rest of the morning, and take your one photo as the light comes up."
twist: "Your dog reads the morning news first with their nose, picking the stops, and the toy waiting under the blanket is today's front page."
variations:
  - "From bed or the sofa: open a window, hide the toy under the blanket beside you and skip the outdoor round."
  - "Away from home: only at a spot where your dog is already comfortable, and keep well back from water edges and drops."
  - "For a dog who sleeps in: skip the sunrise and hold the club at the first sunny spot of the morning."
  - "For limited mobility: make it one stop, a few steps from the door, and sit for the rest."
completion: "Your dog has read the morning news, found the toy and you have watched the sky change and taken your one photo."
photoIdea: "One photo of the sky, and if the light allows, your dog's silhouette with their toy."
memoryPrompt: "Which stop did your dog read first, and what colour was the sky?"
