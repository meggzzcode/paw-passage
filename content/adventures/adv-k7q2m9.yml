title: The Great Toy Showdown
clue: Four contenders enter the ring, and only one makes the front page.
reveal: Your dog is about to judge a tiny tournament of their own toys while you bet on the winner. Predict first, let your dog choose, then crown a champion and put it on a magazine cover.
objective: Run a four-toy bracket where your dog's own choices pick the winner, then give the champion a magazine cover.
instructions:
  - "Pick four toys your dog already knows. Check each one: set aside any with loose parts, torn seams or stuffing coming out."
  - Write your prediction of the champion on a scrap of paper, fold it and put it away. No telling your dog and no peeking.
  - "Round one: put two toys on the floor about a metre apart, on a non-slip surface. Sit still and say nothing. Whichever toy your dog sniffs first, nudges, picks up or settles beside wins the match. Then run the second match the same way."
  - "Round two: set the two winners down the same way for the final."
  - If your dog ignores a pair, swap the toys' places once. If they still do not choose, call it a draw and let both through. Never nudge, point or hold a toy to steer them.
  - Unfold your prediction, announce the champion with a flourish and play with it for a minute as the victory lap.
twist: "You bet against yourself: a sealed prediction goes in first, so you find out whether you know your dog as well as you think."
variations:
  - "Short on time: skip round one and run a two-toy final only (about five minutes)."
  - "For a dog who prefers to lie down: carry each toy to their bed and watch where their nose goes first."
  - "For a lively dog: enter eight toys and let them have a short play break between rounds."
  - "For a puppy: use two soft toys that are made for puppies and keep each match to a minute."
completion: The final has a winner chosen by your dog and you have opened your prediction.
photoIdea: Photograph your dog beside the champion toy against a plain wall, relaxed and not posed. That frame becomes the cover.
memoryPrompt: Which toy won, and did it match your prediction?
