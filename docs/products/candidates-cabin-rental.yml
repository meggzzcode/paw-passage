candidates:
  - id: north-states-mypet-universal-petgate
    name: MyPet Universal Petgate
    brand: North States
    categories: [cabin-vacations]
    summary: A plastic gate for doorways and hallways that mounts by pressure or, optionally, to a solid surface with hardware.
    keySpecs:
      - Models 8619/8625; 26 inches high
      - Adjusts to fit openings 26 to 42 inches wide
      - Pressure mount (no tools or measuring) or hardware mount to a solid surface such as a wooden stud; page says not to use anchors in drywall
      - Plastic, light gray; rounded edges; wall cups add security and the maker says to use them
      - Page says it should never be the top of a stairway when held only by tension
    specSource: {title: North States MyPet Universal Petgate, url: "https://northstatesind.com/north-states-mypet-universal-petgate/", publisher: North States, accessedOn: 2026-11-18}
    manufacturerUrl: "https://northstatesind.com/north-states-mypet-universal-petgate/"
    lastVerified: 2026-11-18
    active: false
    manufacturerClaimsVsIndependentTesting: none cited. Containment strength is not claimed beyond "designed to contain pets".
    relatedGuides: [can-you-leave-a-dog-alone-in-a-vacation-rental, vacation-rental-secure-fenced-yard, vacation-rental-with-a-reactive-dog]
    valueRole: best-overall
    whyItFitsTravel: Pressure mounting lets a renter close off a doorway without drilling, and the width range covers most interior openings.
    valueEvidence: Maker spec only (no reviewer cited). Wide 26-42 in range plus a no-tools pressure option; no warranty stated on the page.
    articlePlacement: "vacation-rental-with-a-reactive-dog, 'Doors, entry and exit routes' (a gate to separate dog from the front door); can-you-leave-a-dog-alone-in-a-vacation-rental, 'Can I use a crate, and what about the furniture?' (a gate as a host-approved alternative to a crate); portable-dog-fence guide, gate section."
    amazonCheck: "Confirm exact model (8619 vs 8625), that the listing is sold by North States or Amazon, width range 26-42 in, and the pressure-mount stairs warning is not contradicted. 26 in is short for a jumper: say so in copy."

