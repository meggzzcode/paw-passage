summary: Three-bedroom 1904 house in West Beach, Santa Barbara; 1 dog up to 50 lbs, a short walk to the sand.
description: A three-bedroom house from 1904 in the West Beach part of Santa Barbara that sleeps 6, with a king bed and two queen beds, two full baths and a half bath. The amenity list includes a deck or patio, a barbecue grill, air conditioning, dog toys and garage parking. The Vrbo FAQ allows one dog up to 50 lbs, and the page does not state a pet fee or any fence detail. West Beach, the harbor and the train station are all within a few minutes on foot. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
