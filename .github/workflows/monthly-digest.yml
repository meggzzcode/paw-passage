# Monthly digest: ONE grouped GitHub issue instead of one issue per finding.
# Combines: content overdue for a re-check, affiliate link configuration, sitemap structure.
# No secrets. GitHub emails the repository owner when the issue is opened or updated.
# Run by hand: GitHub > Actions > "Monthly digest" > "Run workflow".
name: Monthly digest

on:
  schedule:
    - cron: "43 7 3 * *" # the 3rd of each month, 07:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/site-health.mjs digest --out digest-report.md
      - name: Open, update or close the digest issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const title = "Monthly site digest";
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", labels: "site-health", per_page: 100 });
            const existing = open.find((i) => i.title === title);
            if (fs.existsSync("digest-report.md")) {
              const body = fs.readFileSync("digest-report.md", "utf8") + "\n_Updated automatically by the Monthly digest workflow._";
              if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: ["site-health"] });
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: "Fixed: this month's digest found nothing. Closing." });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            }
