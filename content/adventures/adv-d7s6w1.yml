id: "adv-d7s6w1"
title: "The Neighbourhood Sound Map"
clue: "Close your eyes and your street turns into an orchestra."
description: "Slow right down and listen. Pause at three spots near home and draw a sound map of what you hear, while your dog shows you which sounds matter most."
instructions:
  - "Pick three spots near home, such as your doorstep, a park bench and a corner shop. Bring a notebook."
  - "At each spot, stand or sit for two quiet minutes. Listen to what you hear and watch what your dog's ears do."
  - "Draw a simple map of the three places and add a symbol for each sound: a bird, a bus, a bell, a breeze."
  - "Add a star next to the sound your dog reacted to most."
twist: "Your dog's ears are the guide: you map what they notice, not just what you hear."
prep: "light"
supplies: ["Notebook and pen", "Leash"]
