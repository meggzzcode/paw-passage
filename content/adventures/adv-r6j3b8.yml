title: The Sunrise Breakfast Club
clue: One spot, two visits and a dog whose opinion may change by lunch.
reveal: Pick one spot near your door, the Dew Post, and let your dog read it at dawn. Leave a scrap of their blanket there, then come back at noon and see whether the reading changed. Two photos, two headlines, one comparison.
objective: Let your dog read one spot at dawn and again at noon, with a scrap of their blanket left there between, and compare the two headlines.
instructions:
  - "The evening before, pick the Dew Post: one spot within a few steps of your door, such as a doorstep, a balcony edge or a corner of your own yard. Sunrise itself is optional: any time in your dog's first hour of the day works."
  - At dawn, take your dog to the Dew Post on a leash, or into an enclosed space. Stand still and let them read it for as long as they like. Follow their nose, and if they want to go in, go in.
  - "Photo 1: take one photo of the Dew Post with your dog's reading in it (nose down, a quick sniff or a skip). On a scrap of paper write Headline 1, such as Long Read at Dawn."
  - Leave a small clean piece of fabric rubbed on your dog's blanket at the Dew Post, tucked under a plant pot or held down by a stone too big to swallow.
  - Sit with a warm drink (keep it out of your dog's reach) and put the phone away. Take turns naming three things you can see, hear or smell, in a low voice.
  - "Noon check: around midday or later, hand-test the ground first, then go back to the Dew Post with your dog on a leash. Take photo 2 from the same spot and let them read the post and the scrap. Is it a longer read, a shorter one or the same?"
  - Write Headline 2, such as Quick Glance at Noon, and read both aloud. Put the two photos side by side and bring the scrap back inside.
twist: Your dog reads the same spot at dawn and again at noon, and you get two photos and two headlines to compare.
variations:
  - "From the sofa or a window: use your balcony or open door as the Dew Post and let your dog read it from beside you."
  - "For a dog who sleeps in: skip the sunrise and hold the first reading at the first sunny spot of the morning."
  - "For limited mobility: keep the Dew Post to a few steps from the door and sit for the rest."
  - "Sunrise chaser, optional: set an alarm and hold the first reading at actual sunrise, still on your doorstep or balcony."
completion: Your dog has read the Dew Post once and you have taken a photo. Skipping the noon check or ending early still counts.
photoIdea: The two photos of the Dew Post side by side, dawn on the left and noon on the right.
memoryPrompt: Was the Dew Post a longer read at dawn or at noon, and what were your two headlines?
