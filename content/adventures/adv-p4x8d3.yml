title: The Little Picnic Club
clue: A ten-minute trail, three courses at three stops and a guest who orders with their nose.
reveal: Take a tiny picnic trail near home where the menu is made of smells. Your dog visits three stops on a ten-minute loop, each with one scent course, and picks the dish of the day by where they linger. The loop ends on the blanket with a surprise toy under a napkin.
objective: Walk a ten-minute loop with a scent course at each of three stops, let your dog pick the dish of the day, find the surprise on the blanket and raise a cup to it.
instructions:
  - "Plan a flat loop near home that takes about ten minutes with plenty of sniffing: round your yard or patio, along a balcony, or down a hallway and through two rooms. Check the ground for hot surfaces, sharp bits and plants. The last stop is the picnic blanket."
  - "Set out three scent courses, one per stop, each laid flat and too big to swallow: a clean cloth that has sat on the windowsill all morning, a T-shirt you have worn and a small clean piece of fabric rubbed on your dog's own blanket. (A scribbled Starter, Main and Dessert card is optional.) Hide the surprise, one favorite toy, under a folded napkin or small towel on the picnic blanket."
  - Set off on a slack leash, or no leash indoors. At each stop let your dog arrive in their own time and take the course in any order or skip it. Do not point or lead. They can sniff, move on or leave, and the picnic works every way.
  - "Watch for the dish of the day: the stop where they linger longest. Gather up that course on the way to the blanket and put the other two away."
  - At the blanket, lay the winning course in the middle, sit on the far side with your cup and let your dog take the blanket in their own time.
  - "Serve the surprise: when your dog has finished with the dish of the day, nudge the napkin corner so the toy peeks out, then sit back and let them uncover it, carry it off or play."
  - Raise your cup, say the name of the winning dish out loud and let your dog have the blanket for the rest of the picnic.
twist: "The picnic is a trail of smells, not food: your dog orders the dish of the day with their nose, and a toy waits under a napkin at the end."
variations:
  - "Rain version: run the trail along the hallway and through two rooms, and finish on the living-room floor with a window open."
  - "For a nervous dog: use your own yard or balcony, offer only one course and keep it to ten minutes."
  - "For a lively dog: add a fourth stop and tuck the surprise toy a little deeper in its napkin."
  - "For limited mobility: shorten the loop to three stops within a few steps of a chair, and picnic from the chair with the blanket beside you."
completion: Your dog has visited the stops they liked, picked a dish of the day and found the surprise.
photoIdea: Your dog investigating the scent menu at one of the stops, taken from their eye level.
memoryPrompt: Which stop did your dog choose as the dish of the day, and what did they do with the surprise?
