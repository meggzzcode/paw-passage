summary: Three-bedroom Mineral Bluff cabin for 8 with a fire pit and pool table; 2 dogs up to 50 lb each.
description: A roomy three-bedroom cabin in the Ridgeline Vistas area of Mineral Bluff, a quieter corner of Fannin County west of downtown Blue Ridge. It sleeps eight across a queen, a king and a queen bunk, with three bathrooms. The Vrbo FAQ allows two dogs of up to 50 lb each. Outdoors there is a deck, a balcony and a barbecue grill, the title and guest comments point to a fire pit, and indoors there is a game room with a pool table. The page does not say whether the yard is fenced. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
