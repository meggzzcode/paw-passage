id: "adv-f2v8n4"
title: "The Rainy-Day Window Cafe"
clue: "The menu is the weather, and the best table is by the glass."
description: "Turn a rainy afternoon into a cafe for two. Set a cushion by the window, serve yourself a hot drink and watch the world go by with your dog."
instructions:
  - "Put a cushion or blanket beside a window with a view of the rain, the street or the garden."
  - "Make your drink and write a small menu: the day's special, the soup of the weather."
  - "Sit with your dog and be the maitre d'. Name what goes by, from umbrellas to puddles to birds."
  - "Give the cafe a name and a rating out of five paws."
twist: "You run the cafe and your dog is the regular, who gets the best seat in the house."
prep: "none"
supplies: ["Cushion or blanket", "A hot drink for you", "Paper for a menu"]
minutesMin: 5
minutesMax: 30
costMin: 0
