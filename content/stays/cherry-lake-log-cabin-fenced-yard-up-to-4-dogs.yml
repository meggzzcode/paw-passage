summary: Two-bedroom log cabin near Cherry Lake that takes up to 4 dogs with no weight cap; fenced yard and hot tub.
description: A log cabin in the Cherry Lake area outside Blue Ridge, set up for groups with several dogs. Two king bedrooms plus a futon and two twin beds in the living area sleep six, with two bathrooms. The Vrbo FAQ allows up to four dogs and sets the per-pet weight cap at 999 lb, which in practice means no size limit. The listing title promotes a fenced yard and no pet fee, and the amenity list adds a hot tub, a balcony, a grill, an outdoor play area and a game room. The national forest is a short walk away. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
