title: The Great Neighborhood Safari
clue: Somewhere close by there is wildlife, and today you have the binoculars.
reveal: Turn your own block into a safari. Make a pass and a spotter checklist, craft cardboard binoculars and let your dog's ears and nose tell you where to look for the day's sightings.
objective: Tick off at least five items on a spotter checklist on a short walk, guided by what your dog notices.
instructions:
  - "Make the safari pass: a paper ticket with your dog's name and the date. Write a checklist of eight sightings: a bird on a wire, a squirrel, a cat in a window, a bee on a flower, a snail or worm, a tree with a hole, something flapping in the wind, and paw prints in mud."
  - Make binoculars from two cardboard tubes taped side by side. They are for you, not for your dog.
  - Choose a loop near home of ten to twenty minutes, and keep your dog on their leash.
  - Walk slowly. When your dog's ears prick or their nose lifts, stop and look the way they are looking first. Tick the checklist when you spot something.
  - Keep a respectful distance from wildlife. Never let your dog chase, approach or eat anything. If they fix on something, let them watch for a few seconds and then move on calmly.
  - Head home when you have five ticks or your dog signals they are done. Fill in the pass with your favourite sighting.
twist: "Your dog is the tracker: the moment their ears or nose lock on tells you where to point the binoculars."
variations:
  - "Balcony or window safari: tick the checklist from one comfortable spot."
  - "Yard safari: hunt for the checklist in your own garden."
  - "For a nervous dog: go at a quiet hour and keep the loop short."
  - "For a senior dog: take a bench safari and let the sightings come to you."
completion: Five or more items are ticked, or your dog signals that they are done.
photoIdea: Your dog mid-look at something off camera, ears up, taken at a distance without calling them.
memoryPrompt: What was the favourite sighting, and who spotted it first?
