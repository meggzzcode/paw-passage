title: The Sunrise Breakfast Club
clue: "The world is quiet, the sky is changing colour and someone has left the morning paper under the blanket."
reveal: "Start the day with a dawn nose-round of a small patch near home, with your dog choosing which way to read the morning news. A rolled-up paper that smells of you and a favourite toy wait under the blanket at the club spot, and your dog decides which one is today's headline."
objective: "Take a short dog-led sniff round at dawn, let your dog find the paper and the toy waiting at the club spot, and watch the sunrise from there."
instructions:
  - "The evening before, check tomorrow's sunrise time, set an alarm forty minutes earlier and pick a comfortable club spot you can reach easily: a window seat, balcony, doorstep or yard edge. Roll a worn T-shirt or sock into a loose bundle, the morning paper, and tuck it under a folded corner of a blanket there beside one of your dog's favourite toys, both partly showing."
  - "In the morning, take your dog out on a leash or into an enclosed space for the morning round: three short stops within sight of home, such as the doorstep, the nearest tree and the garden edge. Stand still and let your dog choose which stop to read first and how long to stay. That is the morning news."
  - "Follow their nose rather than leading it. If they stop to sniff, wait. If they want to go home early, go home early."
  - "Walk to the club spot together. Let your dog find what is under the blanket in their own time and choose: the paper, the toy or neither. Whichever they pick first is today's headline."
  - "Settle in with your warm drink and put the phone away. It comes out once, for the single sunrise photo. Sit quietly while your dog has the morning, and name three things you can see, hear or smell, taking turns in a low voice."
  - "Close the club with the front-page ritual: say the headline aloud once, such as Toy Beats Paper, Again, leave both on the blanket for your dog to keep for the rest of the morning, and take your one photo as the light comes up."
twist: "Your dog reads the morning news first with their nose, picking the stops, and then picks the front page from the paper and the toy waiting under the blanket."
variations:
  - "From bed or the sofa: open a window, hide the paper and toy under the blanket beside you and skip the outdoor round."
  - "Away from home: only at a spot where your dog is already comfortable, and keep well back from water edges and drops."
  - "For a dog who sleeps in: skip the sunrise and hold the club at the first sunny spot of the morning."
  - "For limited mobility: make it one stop, a few steps from the door, and sit for the rest."
completion: "Your dog has read the morning news, chosen the headline and you have watched the sky change and taken your one photo."
photoIdea: "One photo of the sky, and if the light allows, your dog's silhouette with their toy."
memoryPrompt: "Which stop did your dog read first, what was the headline and what colour was the sky?"
