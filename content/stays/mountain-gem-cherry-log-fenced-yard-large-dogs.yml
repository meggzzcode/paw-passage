summary: Three-bedroom Cherry Log cabin for 6 with a fenced-yard title; 1 dog, no weight cap listed.
description: A three-bedroom cabin in rural Cherry Log, on the road toward Ellijay, with a king in the loft, a king downstairs and a queen on the main level, plus three bathrooms. The Vrbo FAQ allows a single dog and sets the weight cap at 999 lb, so one big dog is not a problem on paper. The title advertises a fenced yard and a past guest mentions it too. The amenity list adds a balcony, grill, game room with ping pong, and a porch and garden. It suits one large dog rather than a pack. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
