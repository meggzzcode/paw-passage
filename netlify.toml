[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push changes only docs, markdown or workflow files. The command exits 0 (skip)
  # only when nothing else differs; if CACHED_COMMIT_REF is missing git errors with a non-zero code and the build runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude).github' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "22"

# Previews no longer show unpublished drafts (the site has no drafts). To preview an unfinished article, set SHOW_DRAFTS to "true" for a branch deploy. Branch and pull-request previews could show unpublished drafts (and say "noindex" to
# search engines). The live site (the "production" context) never does. Preview links are not password
# protected unless you pay for that: anyone with the link can read the drafts, so share them carefully.
[context.branch-deploy.environment]
  SHOW_DRAFTS = "false"

[context.deploy-preview.environment]
  SHOW_DRAFTS = "false"

# Hashed build output never changes, so browsers and the CDN may keep it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for static files. This block does NOT reach HTML pages: they are rendered by the server function, which
# sends Referrer-Policy and Permissions-Policy itself (src/lib/security-headers.ts, wired in src/start.ts).
# X-Frame-Options is not sent on pages because the Lovable editor previews the site in an iframe; see
# docs/SECURITY-AND-RECOVERY.md section 6. There is deliberately no Content-Security-Policy yet (see docs/recovery/08-security-infrastructure.md).
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

