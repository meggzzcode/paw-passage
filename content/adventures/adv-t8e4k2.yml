id: "adv-t8e4k2"
title: "The Scent Detective Agency"
clue: "A secret trail, a quiet nose and a case to solve right at home."
description: "Lay a short scent trail through your home with a favourite toy at the end, then let your dog play detective. Every case closes with a case file entry."
instructions:
  - "While your dog is in another room, rub a worn sock or cloth along the floor to mark a short trail in one or two rooms."
  - "Hide a favourite toy or a few of their usual snacks at the end of the trail, somewhere easy to reach."
  - "Release your dog with a cheerful word and let them follow their nose at their own pace. Stay quiet and do not point."
  - "Celebrate the find, then write the case in a notebook: where the clues were and what the detective did."
twist: "You are the crime scene and your dog is the detective, so keep the trail short and the praise big."
prep: "light"
supplies: ["Worn sock or soft cloth", "A favourite toy or usual snacks", "Notebook"]
minutesMin: 5
minutesMax: 20
costMin: 0
costMax: 0
setting: "indoor"
environments: ["apartment", "house"]
lifeStages: ["puppy", "adult", "senior"]
energy: "moderate"
mobilityFriendly: true
crowd: "none"
otherDogs: false
seasons: []
safety:
  - "Keep the trail clear of slippery floors, stairs and anything breakable, and hide the prize where your dog does not need to jump."
  - "If your dog seems unsure, shorten the trail and make the find easier. End on a success."
variations:
  - "Very gentle: lay the trail on a single mat or rug and place the prize within a few steps."
  - "Check your dog's usual snacks are the ones you normally give, in tiny pieces."
memoryPrompt: "How long did the detective take, and what was their method?"
