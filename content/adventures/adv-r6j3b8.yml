safety:
  - "Mornings can be cold. Check the temperature and dress your dog's spot with a blanket if the air is cool, and stay with them outdoors."
  - "Keep your dog on a leash or in an enclosed space, since dawn is when wildlife is most active."
variations:
  - "From bed or the sofa: open a window and watch the sky from inside."
  - "On a beach or mountain trip, check conditions and keep well back from water edges and drops."
memoryPrompt: "What colour was the sky, and what did your dog notice first?"
