safety:
  - "Keep the fort open at one end so your dog can leave whenever they like, and never cover them in blankets."
  - "Keep the volume low and the fort away from heaters, candles and trailing cables."
variations:
  - "Very low fort: use a single blanket draped over a sofa arm so a stiff dog can step in easily."
  - "For a nervous dog: skip the film and sit quietly in the fort for a few minutes."
