id: "adv-r6j3b8"
title: "The Sunrise Breakfast Club"
clue: "The world is quiet, the sky is changing colour, and the only rule is to sit still."
description: "Greet the morning together at a doorstep, balcony or garden edge. You have a hot drink, your dog has a calm start, and the two of you watch the day arrive."
instructions:
  - "Check the sunrise time the night before and set an alarm about twenty minutes earlier."
  - "Choose a comfy spot you can reach easily: a balcony, a doorstep, a window seat or the garden edge. Bring a blanket."
  - "Sit with your drink while your dog explores at their own pace or lies beside you. Name three things you can see and hear."
  - "Snap one photo of the sky and one of your dog, and note the date and the colour of the morning."
twist: "A club of two with one rule: no phones except for a single sunrise photograph."
prep: "light"
supplies: ["Blanket", "A warm drink for you", "Phone for one photo"]
