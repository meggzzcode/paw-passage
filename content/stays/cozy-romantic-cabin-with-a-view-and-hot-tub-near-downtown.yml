description: This two-bedroom cabin in central Blue Ridge has a hot tub, a deck or porch and a barbecue grill, and sleeps 4 with a king bed in each bedroom. The Vrbo Policies section allows 2 dogs, lists a $95 per dog pet fee (basis not stated), and says no puppies, crates when alone and no furniture. Its weight limit appears as 20 lb in one place and 30 lb in another. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
