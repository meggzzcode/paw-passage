description: A three-bedroom Pacific Beach townhouse in San Diego, advertised as half a block from a beach park near Mission Bay. The listing shows six beds including a loft with a queen bed and a sofa bed, and the page gives both sleeps 8 and a six-bed title. The Vrbo FAQ allows 2 dogs, each up to 50 lb; the pet fee and fence status are not readable. Amenities include a balcony, a shared spa, barbecue grill, air conditioning and a garage. The bay and its sandy shoreline are a short walk away, with the ocean beaches a few minutes by car. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
