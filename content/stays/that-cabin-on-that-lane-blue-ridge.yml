summary: Five-bedroom Blue Ridge cabin for 10 with a hot tub and a fully fenced backyard; dog limit not stated.
description: A large cabin in Blue Ridge, Georgia, with five bedrooms and three baths that sleeps 10, managed by Vacasa. The standout for dog owners is a backyard the page calls fully fenced, with more than 800 feet of fencing, next to a fire pit and a private six-person hot tub. Inside are two living areas, a pool table, a full kitchen, two washer and dryer sets and air conditioning. The page says the home is dog-friendly but does not give a dog count, a weight limit or a pet fee, so check those with Vacasa. We read this from the public Vacasa listing on 2026-11-18 and have not confirmed it with the host.
