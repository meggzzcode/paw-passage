stamps:
  - slug: "first-adventure"
    title: "First Adventure"
    blurb: "Your passport has its first stamp."
    rule: "Complete any adventure."
  - slug: "cozy-companion"
    title: "Cozy Companion"
    blurb: "Quiet time is time well spent."
    rule: "Complete a calm, cozy adventure, such as a quiet one at home. Slow days count."
  - slug: "beach-explorer"
    title: "Beach Explorer"
    blurb: "Sand, shore and open sky."
    rule: "Complete an adventure at a beach, lake or river shore. The free adventures do not cover this yet, and there is no rush."
  - slug: "trail-blazer"
    title: "Trail Blazer"
    blurb: "Your dog led the way."
    rule: "Complete an adventure where your dog sets the route or the pace. A slow pace is the whole idea."
  - slug: "city-explorer"
    title: "City Explorer"
    blurb: "Streets, corners and city sounds."
    rule: "Complete an adventure around your neighborhood or a city. A short loop or a spot by the window counts."
  - slug: "playtime-champion"
    title: "Playtime Champion"
    blurb: "Toys, games and tail wags."
    rule: "Complete a play adventure. Gentle play, a sniff game or a quiet toy swap all count."
  - slug: "road-tripper"
    title: "Road Tripper"
    blurb: "Memories made away from home."
    rule: "Complete an adventure that works on a road trip or a day away, at whatever distance suits your dog."
  - slug: "night-owl"
    title: "Night Owl"
    blurb: "Evening adventures after the lights go down."
    rule: "Complete an adventure that happens in the evening, indoors or out."
  - slug: "sunshine-seeker"
    title: "Sunshine Seeker"
    blurb: "Chasing good light and fresh air."
    rule: "Complete an adventure built around sunlight, sunrise or a sunny spot. A sunny window works."
  - slug: "memory-maker"
    title: "Memory Maker"
    blurb: "Three memories saved to your passport."
    rule: "Save a memory note on three different adventures. Awarded automatically."
  - slug: "seasonal-explorer"
    title: "Seasonal Explorer"
    blurb: "Adventures that mark the time of year."
    rule: "Complete an adventure that suits a particular season."
  - slug: "adventure-legend"
    title: "Adventure Legend"
    blurb: "A full passport of memories."
    rule: "Reach all the achievement milestones. Awarded automatically."
