description: A roughly 3,200 square foot oceanfront house in the village of Cleone, about 4.5 miles north of downtown Fort Bragg, California, with four bedrooms and three baths for up to 12 guests. It sits beside MacKerricher State Park, a short walk from Lake Cleone, and has a hot tub, two decks, a gas grill and a telescope. The Vacasa page welcomes up to 2 dogs and charges a nightly pet fee without stating the amount or a weight limit. The listing text calls the yard sprawling but not fenced; only a review summary mentions fencing. We read this from the public Vacasa listing on 2026-11-18 and have not confirmed it with the host.
