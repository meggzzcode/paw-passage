description: A single-story house in the Mesa neighborhood of Santa Barbara that sleeps 6 across three bedrooms, each with a king bed, and three bathrooms. The listing shows a patio, a barbecue grill, air conditioning, an office and an outdoor play area, and it marks the home as dog-friendly with toys. The Vrbo FAQ allows one dog up to 50 lbs without naming a pet fee, and the page gives no fence detail. Mesa Lane Steps Beach is about a 12-minute walk. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
