summary: Four-bedroom Dahlonega cabin with a game room; 1 dog up to 50 lb listed.
description: A four-bedroom cabin in Lumpkin County, Georgia, that sleeps 8, with a king, two queens and a twin bunk bed, three full bathrooms and a half bath. The Vrbo FAQ allows a single dog of up to 50 lb, so it suits one mid-sized or large-ish dog rather than a pack. The amenity list shows a patio, a barbecue grill, a game room, a kitchenette and air conditioning, plus an outdoor play area. The page does not show a pet fee, fence or hot tub. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
