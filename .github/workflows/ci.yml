name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Netlify installs with npm, so check that a clean npm install works (catches an out-of-date package-lock.json).
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      # The netlify.toml build-skip rule must never skip a build for published Markdown or CMS saves.
      - run: node scripts/test-netlify-ignore.mjs
      - run: npm run build
