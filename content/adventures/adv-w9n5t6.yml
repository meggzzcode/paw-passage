id: "adv-w9n5t6"
title: "Tourists in Our Own Town"
clue: "You live here, but today you are on vacation."
description: "Act like visitors in your own neighbourhood. Choose three sights a tourist would photograph, visit them at your dog's pace and send home a postcard from the trip."
instructions:
  - "Pick three places you pass every day but never stop at: a mural, a fountain, a quirky shop front, an old tree."
  - "Make a mini itinerary of the three stops on paper and give your dog a tourist name."
  - "Visit each stop, pausing for a photo and a few slow sniffs. Skip a stop if your dog is tired or the area is crowded."
  - "Write a postcard to yourselves with the best moment of the trip."
twist: "You will see your own street through the eyes of a tourist, with a dog who is the real local guide."
prep: "light"
supplies: ["Phone for photos", "Paper or a postcard", "Leash and bags"]
minutesMin: 30
minutesMax: 75
costMin: 0
costMax: 5
setting: "outdoor"
environments: ["city", "countryside", "road-trip"]
lifeStages: ["puppy", "adult", "senior"]
energy: "moderate"
mobilityFriendly: false
crowd: "busy"
otherDogs: true
seasons: []
safety:
  - "Keep your dog on a leash and check pavement temperature with your hand before walking in hot or icy weather."
  - "Leave any stop where your dog seems stressed. The itinerary is optional."
variations:
  - "Gentle version: choose three sights on one block, or take the tour by car with short stops."
  - "On a road trip, run the same game at a rest stop or in a town you are passing through."
memoryPrompt: "Which of the three sights surprised you most?"
