title: The Sunrise Breakfast Club
clue: The world is quiet, the sky is changing colour and the only agenda is a nose report.
reveal: Greet the morning together from a doorstep, balcony, window seat or yard edge. You have a warm drink, your dog gives the morning briefing with their nose, and the two of you watch the day arrive.
objective: Watch a sunrise together from a spot you can reach easily, with one photo and no phones otherwise.
instructions:
  - The evening before, check tomorrow's sunrise time and set an alarm twenty-five minutes earlier.
  - "Choose a comfortable spot you can reach easily: a window seat, balcony, doorstep or yard edge. Bring a blanket for you and a spot for your dog."
  - Settle in with your drink. Put the phone away; it comes out once, for the single sunrise photo.
  - "Give the morning briefing: let your dog arrive and sniff the air at their own pace, and notice which way their nose points as the light comes up. That is today's report."
  - Name three things you can see, hear or smell, taking turns. Say them quietly.
  - "Take your one photo. Then write the club minutes: the date, the colour of the sky and who noticed the first thing."
twist: "A club of two with one rule: no phones except for a single sunrise photograph. The only agenda is your dog's morning briefing."
variations:
  - "From bed or the sofa: open a window and watch the sky from inside."
  - "Outdoors on a trip: check conditions and keep well back from water edges and drops."
  - "For a dog who sleeps in: skip the sunrise and hold the club at the first sunny spot of the morning."
completion: You have watched the sky change for a few minutes and taken your one photo.
photoIdea: One photo of the sky, and if the light allows, your dog's silhouette against it.
memoryPrompt: What colour was the sky, and what did your dog notice first?
