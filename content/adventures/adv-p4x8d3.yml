title: The Little Picnic Club
clue: A tiny party for two, with a blanket for a ballroom and a very serious guest.
reveal: Hold a small picnic with a theme taken from your dog. Spread a blanket somewhere quiet, settle in at their pace, and write a picnic postcard home before you leave the blanket.
objective: Spend a relaxed stretch on a blanket together under a theme taken from your dog, and write a picnic postcard.
instructions:
  - "Choose a theme from your dog: their coat colour, a favourite toy, the way they greet you or the sound of their name. Choose one prop that fits, such as a red cloth for a red dog or the favourite toy itself."
  - "Choose a quiet spot where your dog is already relaxed: your yard, a patio, a balcony or a quiet park corner away from other dogs. Check the ground for hot surfaces, sharp bits and plants."
  - Pack a blanket, a bowl and fresh water, shade if it is sunny, your own snack and the prop.
  - Lay the blanket with the prop in the middle and let your dog arrive in their own time. They can explore, sit on it or ignore it, and the picnic works every way.
  - Settle in for at least ten minutes. Keep your own food on the far side of the blanket, out of reach of your dog's nose, and give the picnic a club name such as The Red Dog Social.
  - Write a postcard to your future selves with the theme, the weather and what your dog did first on the blanket.
twist: The whole picnic is decorated around who your dog is, and the postcard is written before you leave the blanket.
variations:
  - "Rain version: lay the blanket on the living-room floor and open a window."
  - "For a nervous dog: use your own yard or balcony and keep it to ten minutes."
  - "For a lively dog: bring a favourite chew toy to settle with."
  - "For limited mobility: picnic from a chair on a porch or patio, with the blanket beside you."
completion: You have spent about ten minutes on the blanket together and written the postcard.
photoIdea: Your dog on or beside the blanket with the theme prop, taken from their eye level.
memoryPrompt: What was the theme, and what did your dog do first on the blanket?
