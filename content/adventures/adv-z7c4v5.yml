title: The Photo Finish Lane
clue: A short strip of grass, two helpers and a slow-motion camera.
reveal: Two people stand at opposite ends of a short strip in your fenced yard and call your dog back and forth. Your phone films it in slow motion, and the sharpest freeze-frame becomes the photo finish.
objective: Set up a short sprint lane, let your dog run between two people and capture a photo-finish frame.
instructions:
  - Pick a fenced yard or a safe enclosed space with dry, non-slip grass or dirt. Mark a lane about 30 feet long using two towels as start and finish lines.
  - Stand one person at each end, facing each other. A third person, or a phone propped on a chair, films in slow-motion mode from the side halfway along.
  - Bring your dog to the start. Put a bowl of fresh water near the lane. Say their name and "ready" once, cheerful and low, then step back.
  - The person at the far end calls once, then crouches. Your dog may run, trot or stroll. All speeds are valid.
  - When your dog reaches the finish, the receiver gives praise and a toy. Then the other person calls them back for a second run.
  - Do at most three or four runs and then stop. Look through the slow-motion clip together and pick your favorite freeze-frame.
  - Write the winning run time on a sticky note and prop it on the finish-line towel for the final picture.
twist: The slow-motion clip turns your dog's ordinary run into a photo finish, and the winning frame is chosen by the family.
variations:
  - "For a small dog: shorten the lane to 15 feet."
  - "For a shy dog: use only one caller and a short lane."
  - "For a puppy: use a 10-foot lane and a very short run."
  - "For an older dog: let them walk, with no running at all."
completion: Your dog has run the lane at least once and you have chosen a photo-finish frame.
photoIdea: The winning slow-motion frame, with your dog mid-stride and ears flying.
memoryPrompt: What did your dog look like at top speed, and who won the call-back?
