safety:
  - "Choose a calm spot with no crowds, loud machines or other dogs, and end the post if anything startles your dog."
  - "Use a leash or your own fenced space, check weather and ground, offer shade and water, and skip slippery surfaces."
  - "Ask your vet before taking a puppy outdoors. Unvaccinated puppies stay off ground that other dogs have used."
