# Business details. Edit these in Pages CMS ("Site settings"). Leave a value empty if you do not have it yet:
# the site then shows an honest "coming soon" message instead of a broken link.
contactEmail: "hello@pawsandpassage.com"
siteUrl: "https://www.pawsandpassage.com"
ga4MeasurementId: "G-1J97C8CPC1"
# Pinterest profile address, e.g. https://www.pinterest.com/yourname/ . Leave empty until ready: the footer icon stays hidden.
# Amazon Associates tracking ID (store ID). Amazon links use {amazonTrackingId} in their address; a buyer changes this one value to retag every Amazon link. Empty = Amazon links are hidden.
amazonTrackingId: "pawspassage-20"
pinterestUrl: "https://www.pinterest.com/paws_and_passage/"
# Stay22 account ID (from hub.stay22.com). Leave empty until you have one: the Stay22 map then stays hidden.
stay22AccountId: ""
# Impact (impact.com) site-ownership verification value. This is the SELLER'S account value: the buyer replaces it with their own, or clears it.
impactSiteVerification: "6535a715-c434-467a-a407-2aeecbf0bf44"
# Which stays the directory lists. "affiliate-only" (default) = a stay is listed only while it has an approved affiliate link in Affiliate links.
# "public-sources" = also list stays that have a public Vrbo or Airbnb source address, with a plain link, no commission label and no booking claim.
# Do not change this without reading docs/BUYER_AFFILIATE_TRANSITION.md (it changes how the site earns).
stayDirectoryMode: "affiliate-only"
