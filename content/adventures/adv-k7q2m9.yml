safety:
  - Use only toys in good shape and put away any that are chewed apart or have loose pieces.
  - Stop whenever your dog loses interest. A choice never has to be completed.
  - If more than one dog lives with you, run it one dog at a time with the other dog elsewhere, so no toy is guarded.
