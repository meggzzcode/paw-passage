title: The Pick-a-Path Expedition
clue: At every fork in the road, the vote goes to the one with the keenest nose.
reveal: Plan a short walk with three safe forks and let your dog choose the way at each one. Where you end up is the expedition, and the postcard records the route you took together.
objective: Walk a short route where your dog picks the way at three safe forks, then write up the expedition.
instructions:
  - "Before you leave, choose three forks on a familiar route where every option is safe: no road to cross, nothing steep, nowhere you would avoid. Write Fork 1, 2 and 3 on a card with the choices."
  - At the first fork, stop, loosen the leash and wait a few relaxed seconds. Read your dog's choice from where they look, lean or head with their nose.
  - Follow their choice for a few minutes. If they do not choose, pick for them and write No vote. You may veto any choice, but only for safety.
  - Repeat at forks two and three. Give the expedition a name and sketch the route with arrows as you go.
  - At the end spot, take a break with water and a few quiet minutes, which is the expedition camp.
  - Draw the route on the back of a postcard and write what you found along the way.
twist: "A choose-your-own-adventure walk: your dog's lean at each fork decides the route, and you only hold a veto for safety."
variations:
  - "Indoor expedition: use forks in a hallway or between rooms."
  - "For a senior or slow dog: choose three forks within one block, five minutes apart."
  - "For a quiet day: use a small park with three paths."
completion: Your dog has voted at three forks, or at the ones you reached, and the route is on the postcard.
photoIdea: Your dog at a fork looking down the path they chose, taken from behind with the route ahead.
memoryPrompt: Where did the expedition end up, and which fork surprised you?
