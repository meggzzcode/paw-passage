safety:
  - Use clean towels and fabric only, and remove anything your dog starts to chew or swallow.
  - Keep the box on a non-slip rug so it does not slide.
  - Keep the paper note sealed in a zip bag and out of your dog's reach, so digging cannot shred or swallow it.
