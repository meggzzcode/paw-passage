title: The Little Picnic Club
clue: "A blanket, a menu of mysteries and a guest who orders with their nose."
reveal: "Hold a small picnic where the menu is made of smells. Set out three scent courses on a blanket, let your dog choose the dish of the day by where they linger, then reveal the chef's surprise hidden under a napkin and close the club with a toast."
objective: "Lay out a three-course scent menu on a blanket, let your dog choose the dish of the day, find the chef's surprise and toast the club."
instructions:
  - "Choose a quiet spot where your dog is already relaxed: your yard, a patio, a balcony or a corner of the living room. Check the ground for hot surfaces, sharp bits and plants."
  - "Write the scent menu on a card: three courses, each a smell that is safe and too big to swallow. For example a large fallen leaf from outside, a clean cloth that has been near the kitchen window, and a T-shirt you have worn. Lay each course on its own corner of the blanket with space between them. Hide the chef's surprise, one favourite toy, under a folded napkin or small towel in the fourth corner."
  - "Let your dog arrive in their own time and take the menu in any order. Do not point or lead. They can sniff, skip a course or leave the blanket, and the picnic works every way."
  - "Watch for the dish of the day: the course they linger over longest. Put the other two away and give the winner the middle of the blanket. Sit down on the far side with your own snack, out of reach of your dog's nose."
  - "Serve the chef's surprise: when your dog has finished with the dish of the day, nudge the napkin corner so the toy peeks out, then sit back and let them uncover it, carry it off or play."
  - "Close the club with a toast: clink your cup against the rim of their water bowl, say the club name once and name the dish of the day out loud as the winner. Let your dog have the blanket for the rest of the picnic."
twist: "The picnic menu is made of smells, not food: your dog orders the dish of the day with their nose, a chef's surprise waits under a napkin, and the toast goes to the winning dish."
variations:
  - "Rain version: lay the blanket on the living-room floor and open a window."
  - "For a nervous dog: use your own yard or balcony, offer only one course and keep it to ten minutes."
  - "For a lively dog: add a fourth scent course and tuck the surprise toy a little deeper in its napkin."
  - "For limited mobility: picnic from a chair on a porch or patio with the blanket beside you and the courses within a few steps."
completion: "Your dog has chosen a dish of the day, found the chef's surprise and you have toasted the club."
photoIdea: "Your dog investigating the scent menu on the blanket, taken from their eye level."
memoryPrompt: "Which course did your dog choose as the dish of the day, and what did they do with the surprise?"
