title: The Paw-trait Studio
clue: Soft window light, a plain wall and a face made for the front page.
reveal: Set up a tiny photo corner beside a window and take relaxed portraits of your dog in natural light. Pick the frame that looks most like them and turn it into a make-believe magazine cover.
objective: Take a set of relaxed window-light portraits and choose one for a magazine cover.
instructions:
  - Find the brightest window with soft, indirect light and a plain wall or curtain behind. Lay your dog's bed or blanket where the light falls gently.
  - Turn the flash off and turn the phone's shutter sound down. Sit or lie low, at your dog's eye level, a couple of steps back.
  - Do not pose or place your dog. Take photos over about ten minutes while they relax, sniff, stretch or watch the window. A soft word or a quiet squeak is allowed if they enjoy it.
  - Pick the three frames where their eyes, ears or whiskers look most like them, then choose one as the cover.
  - Give the cover a magazine name, a silly headline and one line about the exclusive inside.
twist: "Your dog is the art director: only moments they offer count, so there are no props, no poses and no second takes."
variations:
  - "For a dog who will not stay still: photograph them while they nap, with the camera quiet."
  - "No bright window: use a lamp with a soft shade instead of overhead light."
  - "For a puppy: take just a few frames in a minute or two and try again another day."
completion: You have chosen a cover shot and given it a headline.
photoIdea: "The cover itself: a candid portrait at your dog's eye level."
memoryPrompt: What was the headline of your dog's cover?
