description: An oceanfront house in Mendocino, California, with four bedrooms and three baths for up to 8 guests, run by Vacasa and also called Rosemary's Retreat. It has a deck, a patio, a gas grill, a fireplace and step-free access, and the page describes the yard as enclosed and gated, a safe spot for dogs. Dogs must be well-behaved and 50 lb or under, at most 2, and a nightly pet fee applies with no amount shown. Beach distance is not given beyond calling the home oceanfront. We read this from the public Vacasa listing on 2026-11-18 and have not confirmed it with the host.
