summary: Three-bedroom Blue Ridge cabin with a hot tub and fenced yard; 2 pets, 50 lb limit listed.
description: A three-bedroom cabin near downtown Blue Ridge that sleeps 8, with two king beds, a queen and two twins in the living room, plus three full baths and a half bath. The listing title advertises a fenced yard, and the amenity list shows a hot tub, a balcony, a barbecue grill and air conditioning. The Vrbo page caps pets at 2 in total and 50 lb each, and does not mention a fee. Photo captions point to a wood-burning fireplace, though the listing text does not describe it. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
