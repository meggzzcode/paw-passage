safety:
  - Mornings can be cold. Check the temperature and give your dog a blanket if the air is cool, and stay with them outdoors.
  - Keep your dog on a leash or in an enclosed space, since dawn is when wildlife is most active, and keep the round short and within sight of home.
  - Use a toy your dog already knows and that is safe for them, and stay with them while they play with it.
  - Keep hot drinks well away from your dog and use a cup that cannot easily tip.
  - For a puppy, check with your vet about vaccination and readiness before any public outing, and keep to your own yard or home until then.
