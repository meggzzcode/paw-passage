description: A rural, waterfront cabin in Gilmer County that sleeps 4, with a king bed in the main bedroom and another in the loft, and three bathrooms spread over the main floor, loft and basement. The title promises a fenced yard and a sauna, while the amenity list shows a balcony, deck, garden, barbecue grill, air conditioning and a dedicated office space. The Vrbo page caps pets at 4 in total and shows no maximum weight; it says nothing about a pet fee. The national forest edge is a short walk away. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
