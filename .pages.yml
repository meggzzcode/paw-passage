  #

  - name: collections
    label: Adventure collections
    type: file
    path: content/collections.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: collections
        label: Collections
        type: object
        list: true
        fields:
          - {
              name: slug,
              label: Collection code,
              type: string,
              required: true,
              readonly: true,
              description: "Permanent code used by adventures. Do not edit it.",
            }
          - { name: title, label: Title, type: string, required: true }
          - { name: tagline, label: Tagline, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: order, label: Order on the page, type: number, required: true }
          - {
              name: accent,
              label: Accent colour,
              type: select,
              required: true,
              options: { values: [ink, poppy, ochre, sage, sky, plum] },
            }
          - { name: premiumOnly, label: "Filled by the premium library only", type: boolean }

  - name: stamps
    label: Passport stamps
    type: file
    path: content/stamps.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: stamps
        label: Stamps
        type: object
        list: true
        fields:
          - {
              name: slug,
              label: Stamp code,
              type: string,
              required: true,
              readonly: true,
              description: "Permanent code used by adventures. Do not edit it.",
            }
          - { name: title, label: Title, type: string, required: true }
          - { name: blurb, label: Short blurb, type: string, required: true }
          - { name: rule, label: "How it is earned (plain words)", type: text, required: true }

  - name: achievements
    label: Achievements and milestones
    type: file
    path: content/achievements.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - name: achievements
        label: Milestones
        type: object
        list: true
        fields:
          - {
              name: threshold,
              label: "Adventures completed (leave empty for collection complete)",
              type: number,
            }
          - {
              name: kind,
              label: Kind,
              type: select,
              options: { values: [count, collection-complete] },
            }
          - { name: title, label: Title, type: string, required: true }
          - {
              name: reward,
              label: "Keepsake reward (never withholds content)",
              type: text,
              required: true,
            }

  # ------------------------------------------------------------ Business settings
  - name: settings
    label: Business settings
    type: file
    path: content/settings.yml
    format: yaml
    operations:
      create: false
      delete: false
    fields:
      - {
          name: contactEmail,
          label: Business email address (shown on the Contact page),
          type: string,
        }
      - {
          name: siteUrl,
          label: "Website address, e.g. https://pawsandpassage.com (no slash at the end)",
          type: string,
        }
      - {
          name: ga4MeasurementId,
          label: "Google Analytics ID (looks like G-XXXXXXXXXX)",
          type: string,
        }
      - {
          name: amazonTrackingId,
          label: "Amazon Associates tracking ID (looks like yourname-20; Amazon links use it; leave empty to hide Amazon links)",
          type: string,
        }
      - {
          name: pinterestUrl,
          label: "Pinterest profile address (https://www.pinterest.com/yourname/; leave empty until the account is ready)",
          type: string,
        }
      - {
          name: impactSiteVerification,
          label: "Impact (impact.com) site-verification value (from your own Impact account; leave empty if you have none)",
          type: string,
        }
