[build]
  command = "npm run build"
  publish = "dist"
  # The Vite config defaults Nitro to the Cloudflare target. Netlify needs its own preset: it writes the static site to
  # dist/ and the server-rendered pages to .netlify/functions-internal. Verified locally by a build with this variable
  # (a real preview deploy is still required to prove it, see docs/LAUNCH-READINESS.md).
  # Skip the build (and its credits) ONLY when a push changes nothing but docs/, .github/ or root-level Markdown files
  # (README.md, AGENTS.md ...). Published Markdown (content/guides/*.md, content/**/*.md, src/**/*.md) and every
  # Pages CMS save MUST build, so never exclude "*.md" generally: ':(exclude,glob)*.md' matches the repo root only.
  # Exit 0 = skip. An empty CACHED_COMMIT_REF fails the -n test (exit 1), so the build runs. Regression test:
  # node scripts/test-netlify-ignore.mjs (run by CI).
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude).github' ':(exclude,glob)*.md'"

[build.environment]
  NODE_VERSION = "22"
  # The Vite config defaults Nitro to the Cloudflare target. Netlify needs its own preset: it writes the static site to
  # dist/ and the server-rendered pages to .netlify/functions-internal. A local build with this variable produced both
  # (a real preview deploy is still required to prove it, see docs/LAUNCH-READINESS.md).
  NITRO_PRESET = "netlify"

# Hashed build output never changes, so browsers and the CDN may keep it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for static files. This block does NOT reach HTML pages: they are rendered by the server function, which
# sends Referrer-Policy and Permissions-Policy itself (src/lib/security-headers.ts, wired in src/start.ts).
# X-Frame-Options is not sent on pages because the Lovable editor previews the site in an iframe.
# There is deliberately no Content-Security-Policy yet.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

