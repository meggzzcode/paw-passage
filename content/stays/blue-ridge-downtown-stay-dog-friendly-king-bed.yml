description: This two-bedroom place sits in the center of Blue Ridge, within a short walk of the Arts Center and the Scenic Railway, and sleeps 4. It has a kitchen, a dining area, a balcony and a covered porch with rocking chairs. The Vrbo Policies section allows one dog and says additional fees apply, without giving an amount. We read this from the public Vrbo listing on 2026-11-18 and have not confirmed it with the host.
