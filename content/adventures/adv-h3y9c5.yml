id: "adv-h3y9c5"
title: "The Blanket-Fort Cinema Night"
clue: "Lights down, tickets printed and the best seat belongs to someone on four legs."
description: "Build a low blanket fort, make paper tickets and hold a cosy movie night for two. Choose the film together and keep a ticket stub as your keepsake."
instructions:
  - "Drape blankets over a sofa, chairs or cushions to build a low, open-sided fort with a soft floor inside."
  - "Make two paper tickets and let your dog pick the seat by choosing where they settle."
  - "Dim the lights, play a gentle film or nature documentary at low volume and settle in beside your dog."
  - "Stick the tickets onto a page with the film title and a note about who fell asleep first."
twist: "The seat is your dog's choice, and the ticket stub becomes the keepsake."
prep: "light"
supplies: ["Blankets and cushions", "Paper and pen for tickets", "A screen for the film"]
